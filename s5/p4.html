{grp:'4-3. 공정안전보고서 작성심사·확인'},
{id:'d5',title:'5. 공정안전 자료',
 core:'{{유해위험물질 종류·수량 / MSDS / 유해위험설비 목록·사양 / 운전방법 공정도면(PFD·P&ID) / 건물·설비 배치도 / 폭발위험장소 구분도·전기단선도 / 안전설계·제작·설치 지침서}}',
 def:'<ul><li>공정을 이해하고 위험성평가를 하는 데 필요한 기초 자료</li></ul>',
 detail:'<ol><li>취급·저장하고 있거나 취급·저장하려는 유해·위험물질의 종류 및 수량</li><li>유해·위험물질에 대한 물질안전보건자료(MSDS)</li><li>유해·위험설비의 목록 및 사양</li><li>유해·위험설비의 운전방법을 알 수 있는 공정도면 (공정흐름도 PFD, 배관·계장도 P&ID)</li><li>각종 건물·설비의 배치도</li><li>폭발위험장소 구분도 및 전기단선도</li><li>위험설비의 안전설계·제작 및 설치 관련 지침서</li></ol>',

{id:'d6',title:'6. 위험성 평가 (공정위험성 평가)',
 core:'기법 {{체크리스트·상대위험순위·작업자 실수분석·사고예상질문(What-if)·HAZOP·FMECA·FTA·ETA·원인결과분석(CCA)}} / HAZOP 가이드워드 {{No·More·Less·As well as·Part of·Reverse·Other than}}',
 def:'<ul><li>공정안전보고서의 공정위험성 평가: 공정의 잠재 위험을 체계적으로 찾아내고 사고 빈도·피해를 평가해 대책을 세우는 것 (2과목 2장 분석 기법과 연결)</li></ul>',
 detail:'<b>PSM 공정위험성 평가 기법</b><table><tr><th>기법</th><th>특징</th></tr><tr><td>체크리스트</td><td>미리 만든 점검표로 확인 (정성)</td></tr><tr><td>상대위험순위(Dow·Mond 지수)</td><td>설비의 상대적 위험도를 지수로 순위화</td></tr><tr><td>작업자 실수 분석(HEA)</td><td>운전원 실수 가능성과 영향</td></tr><tr><td>사고예상질문분석(What-if)</td><td>"만약 ~하면?" 질문으로 위험 도출</td></tr><tr><td>{{위험과 운전 분석(HAZOP)}}</td><td>공정 변수에 가이드워드를 붙여 이탈의 원인·결과·대책 검토 — 화학공장 대표 기법</td></tr><tr><td>이상위험도분석(FMECA)</td><td>부품 고장형태와 치명도</td></tr><tr><td>결함수분석(FTA)</td><td>정상사상에서 원인 연역 (정량)</td></tr><tr><td>사건수분석(ETA)</td><td>초기 사건에서 결과 귀납 (정량)</td></tr><tr><td>원인결과분석(CCA)</td><td>FTA + ETA 결합</td></tr></table><b>HAZOP 가이드워드</b><table><tr><th>가이드워드</th><th>뜻</th></tr><tr><td>No / Not</td><td>설계 의도의 완전한 부정 (유량 없음)</td></tr><tr><td>More / Less</td><td>양의 증가·감소 (압력·온도·유량)</td></tr><tr><td>As well as</td><td>성질상 증가 (불순물 추가)</td></tr><tr><td>Part of</td><td>성질상 감소 (일부만)</td></tr><tr><td>Reverse</td><td>반대 (역류)</td></tr><tr><td>Other than</td><td>완전한 대체 (다른 물질)</td></tr></table><b>HAZOP 진행</b>: 공정을 검토 구간(노드)으로 나눔 → 변수 + 가이드워드 = 이탈 → 원인 → 결과 → 기존 안전장치 → 개선 권고',
 exam:'<ul><li>HAZOP 가이드워드 뜻 (자주 출제)</li><li>PSM 위험성평가 기법 종류</li></ul>',
 law:'산업안전보건법 시행규칙 제50조, 공정안전보고서 작성 고시.'},

{id:'d7',title:'키워드 카드 — 5과목 주요항목 4',tag:'암기',
 core:'PSM {{자료·평가·운전·비상}} / 30일 전 / 팬 < 블로어 < 압축기 / 캐비테이션 / 파열판 / HAZOP',
 detail:'<table><tr><th>키워드</th><th>짝</th></tr><tr><td>PSM 제출</td><td>{{착공 30일 전, 공단 2부}}</td></tr><tr><td>10kPa 미만</td><td>{{팬}}</td></tr><tr><td>100kPa 이상</td><td>{{압축기}}</td></tr><tr><td>저유량 맥동</td><td>{{서징}}</td></tr><tr><td>흡입 압력 &lt; 증기압, 기포</td><td>{{캐비테이션}}</td></tr><tr><td>펌프를 낮게, 흡입관 굵게</td><td>{{캐비테이션 방지}}</td></tr><tr><td>밸브 급폐쇄</td><td>{{수격작용}}</td></tr><tr><td>리듀서·부싱</td><td>{{관 지름 변경}}</td></tr><tr><td>플러그·캡</td><td>{{관 끝 막음}}</td></tr><tr><td>급격한 압력 상승·독성</td><td>{{파열판}}</td></tr><tr><td>공정 유체 직접 접촉 안전밸브</td><td>{{매년 1회 검사}}</td></tr><tr><td>MOC</td><td>{{변경요소 관리}}</td></tr><tr><td>P&ID</td><td>{{배관·계장도 (공정안전자료)}}</td></tr><tr><td>역류</td><td>{{Reverse}}</td></tr><tr><td>완전 대체</td><td>{{Other than}}</td></tr><tr><td>FTA + ETA</td><td>{{원인결과분석 CCA}}</td></tr></table>'}
];

var MN={
d1:[
 {k:'자 · 평 · 운 · 비',s:'"<b>자평운비</b> → \'자기 평가로 운영비\'" — 자료, 위험성평가, 안전운전, 비상조치',m:'{{공정안전자료}} · {{공정위험성 평가서}} · {{안전운전계획}} · {{비상조치계획}}'},
 {k:'30일 · 2부',s:'"공사 <b>한 달 전</b>, <b>두 권</b> 제출"',m:'{{착공 30일 전}} · {{공단 2부}}'}],
d2:[
 {k:'팬 10 · 블로어 100 · 압축기',s:'"<b>선풍기</b>(팬)는 약하게(10kPa 미만), <b>헤어드라이어</b>(블로어)는 중간, <b>타이어 공기주입기</b>(압축기)는 세게(100kPa↑)"',m:'팬 {{< 10kPa}} · 블로어 {{10~100kPa}} · 압축기 {{≥ 100kPa}}'},
 {k:'캐비테이션 = 빨대',s:'"<b>빨대를 너무 세게</b> 빨면 거품이 생긴다 — 흡입 압력이 너무 낮아서. 그러니 펌프를 낮게, 관은 굵게"',m:'캐비테이션 방지 {{흡입양정↓ · 흡입관 굵고 짧게 · 회전수↓}}'}],
d3:[
 {k:'파열판 = 급·독·막',s:'"<b>급</b>하게 오르거나, <b>독</b>이 새거나, 밸브가 <b>막</b>힐 것 같으면 파열판"',m:'{{급격한 압력 상승}} · {{독성 누출}} · {{안전밸브 막힘 우려}}'},
 {k:'1 · 2 · 4년',s:'"직접 닿으면 <b>매년</b>, 파열판이 앞에서 지켜 주면 <b>2년</b>, 우등생(PSM 우수)은 <b>4년</b>"',m:'{{매년}} · {{2년}} · {{4년}}'}],
d6:[
 {k:'No · More · Less · As well as · Part of · Reverse · Other than',s:'"<b>없다·많다·적다·더 있다·일부만·거꾸로·딴것</b> — 공정 변수에 붙이는 7개 말꼬리"',m:'HAZOP 가이드워드 {{No·More·Less·As well as·Part of·Reverse·Other than}}'}]
};
function mnBox(id){var a=MN[id];if(!a)return '';var h='<div class="mn"><div class="mnh">연상 암기</div>';a.forEach(function(x){h+='<div class="mni"><span class="mnk">'+x.k+'</span><div class="mns">'+x.s+'</div><div class="mnm">→ '+mk(x.m)+'</div></div>'});return h+'</div>';}
var st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
var round=1,maskOn=false,filterOn=false;
var items=DATA.filter(function(d){return d.id});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function g(id){if(!st[id])st[id]={r:[0,0,0,0,0],s:0,v:0};return st[id]}
function mk(t){return (t||'').replace(/\{\{(.+?)\}\}/g,'<span class="m">$1</span>')}

var HINTS={1:'1회독 · 이해: 8칸을 모두 펼쳐 읽습니다. 헷갈리면 「애매함」을 누르세요.',2:'2회독 · 구조화: 세부 내용과 비교표만 봅니다. 애매함은 노란 표시로 강조됩니다.',3:'3회독 · 인출: 핵심 단어가 가려집니다. 떠올린 뒤 눌러 확인하고, 틀리면 ★.',4:'4회독 · 약점: ★·애매함 항목만 다시 풉니다.',5:'5회독 · 초압축: 항목별 한 줄 요약만 가려서 훑습니다. 시험 직전용.'};

function render(){
  var o='',shown=0;
  document.body.classList.toggle('mask',maskOn);
  DATA.forEach(function(d){
    if(d.grp){o+='<h2 class="grp">'+d.grp.replace(/^\S+\s/,function(m){return m})+'</h2>';return}
    var s=g(d.id);
    if((filterOn||round===4)&&!(s.s||s.v))return;
    shown++;
    var open=round===1?ORDER:(round===5?[]:['detail','cmp']);
    var h='<div class="item'+(s.v?' vague':'')+'" id="'+d.id+'"><div class="ih"><div class="tt">'+d.title+(d.tag?'<span class="badge">'+d.tag+'</span>':'')+'</div><div class="chk">';
    for(var i=0;i<5;i++)h+='<label>'+(i+1)+'<input type="checkbox" data-id="'+d.id+'" data-r="'+i+'"'+(s.r[i]?' checked':'')+'></label>';
    h+='</div><div class="ic"><button data-act="v" data-id="'+d.id+'" class="'+(s.v?'on':'')+'">애매함</button><button data-act="s" data-id="'+d.id+'" class="'+(s.s?'on':'')+'">★</button></div></div>';
    h+='<div class="core"><b>핵심</b> · '+mk(d.core)+'</div>';
    h+=mnBox(d.id);
    if(round!==5){
      ORDER.forEach(function(k){
        if(!d[k])return;
        h+='<details'+(open.indexOf(k)>-1?' open':'')+'><summary>'+LABEL[k]+'</summary><div class="cb">'+mk(d[k])+'</div></details>';
      });
    }
    h+='</div>';o+=h;
  });
  if(!shown)o+='<div class="empty">표시할 항목이 없습니다. ★·애매함을 표시한 항목이 여기에 모입니다.</div>';
  document.getElementById('list').innerHTML=o;
  var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
  document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
  document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  document.getElementById('hint').textContent=HINTS[round];
  var rb=document.querySelectorAll('#rounds button');
  for(var i=0;i<rb.length;i++)rb[i].classList.toggle('on',i===round-1);
  document.getElementById('bMask').classList.toggle('on',maskOn);
  document.getElementById('bStar').classList.toggle('on',filterOn);
}

(function init(){
  var r=document.getElementById('rounds');
  for(var i=1;i<=5;i++){var b=document.createElement('button');b.innerHTML=i+'<span class="w">회독</span>';b.setAttribute('data-round',i);r.appendChild(b)}
  r.addEventListener('click',function(e){
    var bt=e.target.closest('button');var n=bt&&bt.getAttribute('data-round');if(!n)return;
    round=+n;maskOn=(round>=3);render();
  });
  document.getElementById('bMask').onclick=function(){maskOn=!maskOn;render()};
  document.getElementById('bStar').onclick=function(){filterOn=!filterOn;render()};
  document.getElementById('list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('m')&&document.body.classList.contains('mask')){t.classList.toggle('show');return}
    var a=t.getAttribute&&t.getAttribute('data-act');
    if(a){var s=g(t.getAttribute('data-id'));s[a]=s[a]?0:1;save();render()}
  });
  document.getElementById('list').addEventListener('change',function(e){
    var t=e.target;if(t.type!=='checkbox')return;
    var s=g(t.getAttribute('data-id'));s.r[+t.getAttribute('data-r')]=t.checked?1:0;save();
    var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
    document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
    document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  });
  render();
})();
</script>
