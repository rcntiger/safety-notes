details{border-top:1px solid var(--line)}

.m{border-bottom:1px dotted var(--pri);font-weight:600}

}

 detail:'<b>산업안전보건법</b><table><tr><th>직책·조직</th><th>건설업 기준</th></tr><tr><td>안전보건관리책임자</td><td>공사금액 {{20억}} 이상 (현장소장)</td></tr><tr><td>안전관리자</td><td>공사금액 {{50억}} 이상, 전담 120억(토목 150억) 이상</td></tr><tr><td>보건관리자</td><td>공사금액 800억(토목 1,000억) 이상 등</td></tr><tr><td>안전보건총괄책임자</td><td>총공사금액 {{20억}} 이상 도급인</td></tr><tr><td>노사협의체</td><td>공사금액 {{120억}}(토목 150억) 이상, 2개월마다</td></tr><tr><td>안전보건조정자</td><td>분리 발주 공사금액 합계 {{50억}} 이상, 발주자가 둠</td></tr><tr><td>관리감독자</td><td>공종별 직장·반장</td></tr></table><b>건설기술진흥법</b>: 안전총괄책임자(현장대리인), 분야별 안전관리책임자(공사 감독자), 안전관리담당자, 협력업체 안전관리 담당<br><b>도급인의 의무</b>: 협의체(월 1회), 순회점검(2일 1회), 수급인 교육 지원, 위험 작업 시 확인',

 law:'산업안전보건법 시행령 별표 2·3·5, 제52조·제63조, 건설기술진흥법 시행령 제100조.'},

{id:'a5',title:'5. 시공 및 재해사례 검토',
 core:'건설 재해 형태 {{떨어짐(추락) 1위}} → 끼임·부딪힘·물체에 맞음·넘어짐 / 사망 원인 {{추락 절반 이상}} / 사례 검토 → {{공종별 위험 예측·TBM·교육 자료}}',
 def:'<ul><li>과거 시공 경험과 재해 사례를 분석해 이번 공사의 위험을 미리 예측하는 활동</li></ul>',
 detail:'<ul><li>건설업 사망재해의 가장 큰 비중은 <b>떨어짐(추락)</b> — 비계·지붕·개구부·사다리·고소작업대</li><li>그 밖에 부딪힘(장비), 물체에 맞음(낙하물), 끼임(장비·자재), 무너짐(굴착·거푸집), 감전</li><li>공종별 주요 재해<ul><li>토공·굴착: 붕괴, 장비 충돌</li><li>골조: 거푸집·동바리 붕괴, 추락</li><li>철골: 추락, 낙하</li><li>마감: 사다리·말비계 추락, 질식(도장·방수 밀폐 공간)</li><li>해체: 붕괴, 낙하</li></ul></li><li>활용: 위험성평가, 작업 전 TBM, 안전교육 자료, 작업 순서 조정</li><li>아차사고 사례도 수집·공유</li></ul>',
 exam:'<ul><li>건설업 재해 형태 1위 = 떨어짐</li></ul>',
 law:'산업재해 통계(고용노동부·공단).'},

{id:'a6',title:'키워드 카드 — 6과목 주요항목 1',tag:'암기',
 core:'산안법 {{유해위험방지계획서}} / 건진법 {{안전관리계획서}} / 발주자 {{안전보건대장}} / 20·50·120억',
 detail:'<table><tr><th>키워드</th><th>짝</th></tr><tr><td>공단 제출 계획서</td><td>{{유해위험방지계획서}}</td></tr><tr><td>건설기술진흥법</td><td>{{안전관리계획서}}</td></tr><tr><td>기본 → 설계 → 공사</td><td>{{안전보건대장}}</td></tr><tr><td>안전보건대장 대상</td><td>{{총공사금액 50억 이상}}</td></tr><tr><td>적정 공사기간</td><td>{{발주자 의무 (제69조)}}</td></tr><tr><td>설계변경 요청</td><td>{{가설구조물 붕괴 위험 시}}</td></tr><tr><td>건설 재해 1위</td><td>{{떨어짐}}</td></tr><tr><td>노사협의체</td><td>{{120억(토목 150억), 2개월마다}}</td></tr></table>'}
];

var MN={
a1:[
 {k:'산안 = 유해위험 / 건진 = 안전관리',s:'"<b>산</b>업안전 → <b>유</b>해위험(사람 보호, 공단) / <b>건</b>설기술 → <b>안</b>전관리(시설물, 발주청)" — 산유 / 건안',m:'산안법 {{유해위험방지계획서}} / 건진법 {{안전관리계획서}}'},
 {k:'기 → 설 → 공',s:'"<b>기설공</b> → 기본(계획) → 설계 → 공사 — 발주자가 단계마다 대장을 넘긴다"',m:'{{기본안전보건대장}} → {{설계안전보건대장}} → {{공사안전보건대장}}'}],
a2:[
 {k:'옥 · 변 · 고 · 다 · 일',s:'"<b>옥변고다일</b> → 바깥(옥외), 계속 바뀌고(변동), 높고(고소), 여러 업체(다단계), 일용직"',m:'{{옥외}} · {{작업장 변동}} · {{고소·중량물}} · {{다단계 도급}} · {{일용직}}'}],
a4:[
 {k:'20 · 50 · 120',s:'"건설은 <b>20억</b> 소장님(책임자·총괄), <b>50억</b> 안전관리자(·조정자), <b>120억</b> 회의(노사협의체)"',m:'{{20억 책임자·총괄}} / {{50억 안전관리자·조정자}} / {{120억 노사협의체}}'}]
};
function mnBox(id){var a=MN[id];if(!a)return '';var h='<div class="mn"><div class="mnh">연상 암기</div>';a.forEach(function(x){h+='<div class="mni"><span class="mnk">'+x.k+'</span><div class="mns">'+x.s+'</div><div class="mnm">→ '+mk(x.m)+'</div></div>'});return h+'</div>';}
var st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
var round=1,maskOn=false,filterOn=false;
var items=DATA.filter(function(d){return d.id});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function g(id){if(!st[id])st[id]={r:[0,0,0,0,0],s:0,v:0};return st[id]}
function mk(t){return (t||'').replace(/\{\{(.+?)\}\}/g,'<span class="m">$1</span>')}

var HINTS={1:'1회독 · 이해: 8칸을 모두 펼쳐 읽습니다. 헷갈리면 「애매함」을 누르세요.',2:'2회독 · 구조화: 세부 내용과 비교표만 봅니다. 애매함은 노란 표시로 강조됩니다.',3:'3회독 · 인출: 핵심 단어가 가려집니다. 떠올린 뒤 눌러 확인하고, 틀리면 ★.',4:'4회독 · 약점: ★·애매함 항목만 다시 풉니다.',5:'5회독 · 초압축: 항목별 한 줄 요약만 가려서 훑습니다. 시험 직전용.'};

function render(){
  var o='',shown=0;
  document.body.classList.toggle('mask',maskOn);
  DATA.forEach(function(d){
    if(d.grp){o+='<h2 class="grp">'+d.grp.replace(/^\S+\s/,function(m){return m})+'</h2>';return}
    var s=g(d.id);
    if((filterOn||round===4)&&!(s.s||s.v))return;
    shown++;
    var open=round===1?ORDER:(round===5?[]:['detail','cmp']);
    var h='<div class="item'+(s.v?' vague':'')+'" id="'+d.id+'"><div class="ih"><div class="tt">'+d.title+(d.tag?'<span class="badge">'+d.tag+'</span>':'')+'</div><div class="chk">';
    for(var i=0;i<5;i++)h+='<label>'+(i+1)+'<input type="checkbox" data-id="'+d.id+'" data-r="'+i+'"'+(s.r[i]?' checked':'')+'></label>';
    h+='</div><div class="ic"><button data-act="v" data-id="'+d.id+'" class="'+(s.v?'on':'')+'">애매함</button><button data-act="s" data-id="'+d.id+'" class="'+(s.s?'on':'')+'">★</button></div></div>';
    h+='<div class="core"><b>핵심</b> · '+mk(d.core)+'</div>';
    h+=mnBox(d.id);
    if(round!==5){
      ORDER.forEach(function(k){
        if(!d[k])return;
        h+='<details'+(open.indexOf(k)>-1?' open':'')+'><summary>'+LABEL[k]+'</summary><div class="cb">'+mk(d[k])+'</div></details>';
      });
    }
    h+='</div>';o+=h;
  });
  if(!shown)o+='<div class="empty">표시할 항목이 없습니다. ★·애매함을 표시한 항목이 여기에 모입니다.</div>';
  document.getElementById('list').innerHTML=o;
  var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
  document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
  document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  document.getElementById('hint').textContent=HINTS[round];
  var rb=document.querySelectorAll('#rounds button');
  for(var i=0;i<rb.length;i++)rb[i].classList.toggle('on',i===round-1);
  document.getElementById('bMask').classList.toggle('on',maskOn);
  document.getElementById('bStar').classList.toggle('on',filterOn);
}

(function init(){
  var r=document.getElementById('rounds');
  for(var i=1;i<=5;i++){var b=document.createElement('button');b.innerHTML=i+'<span class="w">회독</span>';b.setAttribute('data-round',i);r.appendChild(b)}
  r.addEventListener('click',function(e){
    var bt=e.target.closest('button');var n=bt&&bt.getAttribute('data-round');if(!n)return;
    round=+n;maskOn=(round>=3);render();
  });
  document.getElementById('bMask').onclick=function(){maskOn=!maskOn;render()};
  document.getElementById('bStar').onclick=function(){filterOn=!filterOn;render()};
  document.getElementById('list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('m')&&document.body.classList.contains('mask')){t.classList.toggle('show');return}
    var a=t.getAttribute&&t.getAttribute('data-act');
    if(a){var s=g(t.getAttribute('data-id'));s[a]=s[a]?0:1;save();render()}
  });
  document.getElementById('list').addEventListener('change',function(e){
    var t=e.target;if(t.type!=='checkbox')return;
    var s=g(t.getAttribute('data-id'));s.r[+t.getAttribute('data-r')]=t.checked?1:0;save();
    var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
    document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
    document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  });
  render();
})();
</script>
</body>
</html>
