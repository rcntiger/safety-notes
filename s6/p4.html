 detail:'<b>수공구</b><ul><li>망치: 자루 고정 상태, 쐐기 확인, 타격면 변형 없는 것</li><li>정: 머리 부분 버섯 모양 변형 시 갈아서 사용, 보안경</li><li>렌치: 규격에 맞는 것, 파이프로 연장 금지</li><li>공구는 던지지 말고 공구 주머니에, 고소 작업 시 낙하 방지 끈</li></ul><b>전동공구</b><ul><li>접지 또는 이중절연 구조, 누전차단기 연결 (임시 배선)</li><li>사용 전 코드·플러그 손상 점검, 비에 젖지 않게</li><li>휴대용 그라인더: 덮개 부착, 숫돌 규격·최고 사용속도 확인, 작업 전 1분 시운전</li><li>날·비트 교체는 전원 차단 후</li><li>회전 공구 사용 시 면장갑 금지, 보안경·방진마스크</li><li>타정총(네일건): 사람을 향하지 않기, 안전장치 해제 금지</li></ul>',
 exam:'<ul><li>전동공구 감전 방지 조치</li></ul>',
 law:'안전보건기준규칙 제2편 제1장·제3장.'},

{id:'d5',title:'5. 건설장비의 종류 및 안전수칙',
 core:'차량계 건설기계 {{불도저·굴착기·로더·스크레이퍼·모터그레이더·롤러·덤프트럭·항타기·천공기}} / 수칙 {{작업계획서·유도자·제한속도(10km/h 초과 기계)·전도 방지·헤드가드·운전석 이탈 시 버킷 내리고 시동 끔·주용도 외 사용 금지}} / 항타기 {{버팀대·버팀줄 3개 이상·권상 와이어로프 안전계수 5}}',
 def:'<ul><li><b>차량계 건설기계</b>: 동력원으로 스스로 이동하며 굴착·운반·다짐 등을 하는 건설기계</li></ul>',
 detail:'<b>주요 장비와 용도</b><table><tr><th>장비</th><th>용도</th></tr><tr><td>불도저</td><td>굴착·운반·정지(땅 고르기)</td></tr><tr><td>굴착기(백호)</td><td>지면보다 낮은 곳 굴착 (파워셔블은 높은 곳)</td></tr><tr><td>로더</td><td>적재</td></tr><tr><td>스크레이퍼</td><td>굴착·적재·운반·하역 일괄</td></tr><tr><td>모터그레이더</td><td>노면 정지 (마무리)</td></tr><tr><td>롤러</td><td>다짐 (탠덤·타이어·진동)</td></tr><tr><td>항타기·항발기</td><td>말뚝 박기·뽑기</td></tr></table><b>차량계 건설기계 안전수칙</b><ul><li>작업계획서 작성 (기계 종류·성능, 운행경로, 작업방법)</li><li>최고속도 10km/h를 넘는 기계는 지형·지반에 맞는 제한속도 지정</li><li>전도·전락 방지: 유도자 배치, 지반 부동침하 방지, 갓길 붕괴 방지, 도로 폭 유지</li><li>접촉 방지: 작업 반경 내 출입 금지, 유도자 신호</li><li>낙석 위험 장소: 견고한 헤드가드</li><li>주용도 외 사용 금지 (굴착기로 인양 금지 — 예외 조건 충족 시만)</li><li>운전자 이탈 시: 버킷·디퍼를 지면에 내리고, 원동기 정지·브레이크, 키 분리</li><li>붐·암 아래에서 수리 시 안전지주·안전블록</li></ul><b>항타기·항발기</b><ul><li>무너짐 방지: 버팀대만으로 상단 고정 시 버팀대 3개 이상, 버팀줄만으로 고정 시 버팀줄 3개 이상, 연약 지반은 깔판·받침목</li><li>권상용 와이어로프: 안전계수 5 이상, 드럼에 적어도 2회 감긴 상태로 남을 길이</li></ul><b>타워크레인 풍속 기준</b>: 순간풍속 10m/s 초과 시 설치·수리·점검·해체 중지, 20m/s 초과 시 운전 중지',
 exam:'<ul><li>장비와 용도 짝짓기</li><li>항타기 버팀대·버팀줄 3개, 와이어로프 안전계수 5</li><li>타워크레인 풍속 10·20m/s</li></ul>',
 law:'안전보건기준규칙 제196조~제221조(차량계 건설기계), 제207조~제221조(항타기·항발기), 제37조(악천후 및 강풍 시 작업 중지).'},

{id:'d6',title:'키워드 카드 — 6과목 주요항목 4',tag:'암기',
 core:'2m / 방호망 10·12%·3m / 낙하물망 10·2m·20~30° / 1.8·1.0·0.5·1.2 / 3개·5',
 detail:'<table><tr><th>키워드</th><th>짝</th></tr><tr><td>추락 방지 첫 순서</td><td>{{작업발판}}</td></tr><tr><td>추락방호망 처짐</td><td>{{짧은 변 12% 이상}}</td></tr><tr><td>추락방호망 내민 길이</td><td>{{3m 이상}}</td></tr><tr><td>낙하물방지망 각도</td><td>{{20~30°}}</td></tr><tr><td>낙하물방지망 내민 길이</td><td>{{2m 이상}}</td></tr><tr><td>모래 굴착면</td><td>{{1 : 1.8}}</td></tr><tr><td>경암</td><td>{{1 : 0.5}}</td></tr><tr><td>그 밖의 흙</td><td>{{1 : 1.2}}</td></tr><tr><td>지표수·지하수 침투</td><td>{{외적 붕괴 원인}}</td></tr><tr><td>투하설비</td><td>{{3m 이상}}</td></tr><tr><td>노면 마무리</td><td>{{모터그레이더}}</td></tr><tr><td>제한속도 지정</td><td>{{최고속도 10km/h 초과 기계}}</td></tr><tr><td>항타기 버팀줄</td><td>{{3개 이상}}</td></tr><tr><td>타워크레인 운전 중지</td><td>{{순간풍속 20m/s 초과}}</td></tr></table>'}
];

var MN={
d1:[
 {k:'발판 → 방호망 → 안전대',s:'"<b>바닥</b>을 깔고, 안 되면 <b>그물</b>을 치고, 그것도 안 되면 <b>밧줄</b>을 맨다"',m:'{{작업발판}} → {{추락방호망}} → {{안전대}}'},
 {k:'사람 그물 10 · 12 · 3',s:'"<b>사람</b> 받는 그물: <b>10</b>m 안에서, <b>12</b>% 출렁이게, <b>3</b>m 내밀어"',m:'{{10m 이내}} · {{처짐 12%}} · {{내민 3m}}'}],
d2:[
 {k:'모 1.8 · 연 1.0 · 경 0.5 · 흙 1.2',s:'"<b>모래</b>는 잘 무너지니 <b>가장 완만</b>(1.8), <b>단단한 바위</b>는 <b>가장 가파르게</b>(0.5), 무른 바위 1.0, 나머지 흙 1.2"',m:'모래 {{1:1.8}} · 연암·풍화암 {{1:1.0}} · 경암 {{1:0.5}} · 그 밖의 흙 {{1:1.2}}'}],
d3:[
 {k:'물건 그물 10 · 2 · 20~30',s:'"<b>물건</b> 받는 그물: <b>10</b>m마다, <b>2</b>m 내밀어, <b>20~30°</b> 비스듬히 (물건이 굴러 안쪽으로)"',m:'{{10m마다}} · {{내민 2m}} · {{20~30°}}'}],
d5:[
 {k:'3개 · 5 · 2회',s:'"항타기는 <b>삼발이</b>(버팀대·버팀줄 3개), 로프는 <b>5배</b> 튼튼, 드럼에 <b>2바퀴</b> 남게"',m:'{{버팀대·버팀줄 3개 이상}} · {{안전계수 5}} · {{2회 감김}}'},
 {k:'10 · 20m/s',s:'"바람 <b>10</b>이면 조립·해체 멈추고, <b>20</b>이면 운전도 멈춘다"',m:'{{10m/s 초과 설치·해체 중지}} / {{20m/s 초과 운전 중지}}'}]
};
function mnBox(id){var a=MN[id];if(!a)return '';var h='<div class="mn"><div class="mnh">연상 암기</div>';a.forEach(function(x){h+='<div class="mni"><span class="mnk">'+x.k+'</span><div class="mns">'+x.s+'</div><div class="mnm">→ '+mk(x.m)+'</div></div>'});return h+'</div>';}
var st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
var round=1,maskOn=false,filterOn=false;
var items=DATA.filter(function(d){return d.id});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function g(id){if(!st[id])st[id]={r:[0,0,0,0,0],s:0,v:0};return st[id]}
function mk(t){return (t||'').replace(/\{\{(.+?)\}\}/g,'<span class="m">$1</span>')}

var HINTS={1:'1회독 · 이해: 8칸을 모두 펼쳐 읽습니다. 헷갈리면 「애매함」을 누르세요.',2:'2회독 · 구조화: 세부 내용과 비교표만 봅니다. 애매함은 노란 표시로 강조됩니다.',3:'3회독 · 인출: 핵심 단어가 가려집니다. 떠올린 뒤 눌러 확인하고, 틀리면 ★.',4:'4회독 · 약점: ★·애매함 항목만 다시 풉니다.',5:'5회독 · 초압축: 항목별 한 줄 요약만 가려서 훑습니다. 시험 직전용.'};

function render(){
  var o='',shown=0;
  document.body.classList.toggle('mask',maskOn);
  DATA.forEach(function(d){
    if(d.grp){o+='<h2 class="grp">'+d.grp.replace(/^\S+\s/,function(m){return m})+'</h2>';return}
    var s=g(d.id);
    if((filterOn||round===4)&&!(s.s||s.v))return;
    shown++;
    var open=round===1?ORDER:(round===5?[]:['detail','cmp']);
    var h='<div class="item'+(s.v?' vague':'')+'" id="'+d.id+'"><div class="ih"><div class="tt">'+d.title+(d.tag?'<span class="badge">'+d.tag+'</span>':'')+'</div><div class="chk">';
    for(var i=0;i<5;i++)h+='<label>'+(i+1)+'<input type="checkbox" data-id="'+d.id+'" data-r="'+i+'"'+(s.r[i]?' checked':'')+'></label>';
    h+='</div><div class="ic"><button data-act="v" data-id="'+d.id+'" class="'+(s.v?'on':'')+'">애매함</button><button data-act="s" data-id="'+d.id+'" class="'+(s.s?'on':'')+'">★</button></div></div>';
    h+='<div class="core"><b>핵심</b> · '+mk(d.core)+'</div>';
    h+=mnBox(d.id);
    if(round!==5){
      ORDER.forEach(function(k){
        if(!d[k])return;
        h+='<details'+(open.indexOf(k)>-1?' open':'')+'><summary>'+LABEL[k]+'</summary><div class="cb">'+mk(d[k])+'</div></details>';
      });
    }
    h+='</div>';o+=h;
  });
  if(!shown)o+='<div class="empty">표시할 항목이 없습니다. ★·애매함을 표시한 항목이 여기에 모입니다.</div>';
  document.getElementById('list').innerHTML=o;
  var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
  document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
  document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  document.getElementById('hint').textContent=HINTS[round];
  var rb=document.querySelectorAll('#rounds button');
  for(var i=0;i<rb.length;i++)rb[i].classList.toggle('on',i===round-1);
  document.getElementById('bMask').classList.toggle('on',maskOn);
  document.getElementById('bStar').classList.toggle('on',filterOn);
}

(function init(){
  var r=document.getElementById('rounds');
  for(var i=1;i<=5;i++){var b=document.createElement('button');b.innerHTML=i+'<span class="w">회독</span>';b.setAttribute('data-round',i);r.appendChild(b)}
  r.addEventListener('click',function(e){
    var bt=e.target.closest('button');var n=bt&&bt.getAttribute('data-round');if(!n)return;
    round=+n;maskOn=(round>=3);render();
  });
  document.getElementById('bMask').onclick=function(){maskOn=!maskOn;render()};
  document.getElementById('bStar').onclick=function(){filterOn=!filterOn;render()};
  document.getElementById('list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('m')&&document.body.classList.contains('mask')){t.classList.toggle('show');return}
    var a=t.getAttribute&&t.getAttribute('data-act');
    if(a){var s=g(t.getAttribute('data-id'));s[a]=s[a]?0:1;save();render()}
  });
  document.getElementById('list').addEventListener('change',function(e){
    var t=e.target;if(t.type!=='checkbox')return;
    var s=g(t.getAttribute('data-id'));s.r[+t.getAttribute('data-r')]=t.checked?1:0;save();
    var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
    document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
    document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  });
  render();
})();
</script>
</body>
</html>
