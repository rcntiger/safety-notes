<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--sub:#5b6577;--line:#dfe3ea;--pri:#1f5fbf;--pri2:#e6effc;--warn:#fff4d6;--star:#e0a100;--ok:#1c8a4b;--mask:#1d2330}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 80px}
header{padding:12px 0 4px}
.ctrl{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.ctrl .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 0 2px}
.meta{color:var(--sub);font-size:12.5px}
.rounds{display:flex;gap:4px}
.rounds button,.tools button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
.rounds button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0}
h2.grp{font-size:16px;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--pri)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.item.vague{border-color:var(--star);background:linear-gradient(var(--warn),var(--warn)) top/100% 4px no-repeat,var(--card)}
.ih{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;flex-wrap:wrap}
.ih .tt{flex:1 1 220px;font-weight:700}
.ih .tt small{display:block;font-weight:400;color:var(--sub);font-size:12.5px}
.badge{font-size:11px;background:var(--warn);color:var(--tx);padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:600}
.chk{display:flex;gap:3px;align-items:center}
.chk label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.chk input{margin:2px 0 0}
.ic button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:3px 8px;font-size:13px;cursor:pointer;margin-left:4px}
.ic button.on{color:var(--star);border-color:var(--star);font-weight:700}
.core{margin:0 14px 10px;padding:8px 12px;background:var(--pri2);border-radius:8px;font-size:14px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--pri);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";}
details[open]>summary:before{content:"▾ ";}
.cb{padding:2px 14px 12px}
.cb ul{margin:4px 0;padding-left:20px}
.cb table{border-collapse:collapse;width:100%;margin:6px 0;font-size:13.5px}
.cb th,.cb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.cb th{background:var(--pri2)}
.m{border-bottom:1px dotted var(--pri);font-weight:600}
body.mask .m{background:var(--mask);color:transparent;border-radius:3px;cursor:pointer;border-bottom:none;user-select:none}
body.mask .m.show{background:transparent;color:inherit;border-bottom:1px dotted var(--pri)}
.empty{text-align:center;color:var(--sub);padding:30px}
.mn{margin:0 14px 10px;padding:8px 12px;border-left:4px solid var(--star);border-radius:8px;background:var(--warn)}
.mnh{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.mni{padding:5px 0;border-top:1px dashed var(--line)}
.mni:first-of-type{border-top:none}
.mnk{display:inline-block;font-weight:700;background:var(--star);color:#1d2330;border-radius:6px;padding:0 7px;font-size:12.5px}
.mns{font-size:14px;margin:3px 0 2px}
.mnm{font-size:13px;color:var(--sub)}
.nav{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:6px 0 2px}
.nav a{color:var(--pri);text-decoration:none}
.nav a:hover{text-decoration:underline}
.nav .dis{color:var(--sub);opacity:.5}
footer{margin-top:30px;font-size:12.5px;color:var(--sub)}
@media (max-width:640px){
 h1{font-size:16px}
 .ctrl{padding:6px 0 4px}
 .ctrl .row{flex-wrap:nowrap;gap:4px}
 .rounds button,.tools button{padding:5px 8px;font-size:12.5px}
 .rounds .w{display:none}
 .tools .w{display:none}
 #prog{font-size:11.5px;white-space:nowrap}
 .ih{padding:10px 12px}
 .core{margin:0 12px 8px}
 .mn{margin:0 12px 8px}
 summary{padding:7px 12px}
 .cb{padding:2px 12px 10px}
}
@media (min-width:641px){
 body{font-size:17px}
 h1{font-size:20px}
 .meta,.hint,.ih .tt small{font-size:14.5px}
 .rounds button,.tools button,.ic button{font-size:15px}
 h2.grp{font-size:18px}
 .badge{font-size:13px}
 .chk label{font-size:14px}
 .core{font-size:16px}
 summary,.cb table{font-size:15.5px}
 .cb span[style*="font-size:13px"]{font-size:15px!important}
 .mnh{font-size:14px}
 .mnk{font-size:14.5px}
 .mns{font-size:16px}
 .mnm{font-size:15px}
 footer{font-size:14.5px}
}
</style>

 core:'브레인스토밍 4원칙 {{비판금지·자유분방·대량발언·수정발언}} / {{역할연기·사례연구·인바스켓·감수성훈련(T그룹)·그리드훈련}}',
 def:'<ul><li>관리자·근로자의 문제해결 능력, 인간관계 능력을 기르는 다양한 훈련 방법</li></ul>',
 detail:'<b>브레인스토밍 (오스본)</b> — 아이디어를 많이 끌어내는 집단 기법<table><tr><th>원칙</th><th>뜻</th></tr><tr><td>{{비판금지}}</td><td>남의 의견을 비판하지 않음</td></tr><tr><td>{{자유분방}}</td><td>마음대로 자유롭게 발언</td></tr><tr><td>{{대량발언}}</td><td>무엇이든 많이 발언 (질보다 양)</td></tr><tr><td>{{수정발언}}</td><td>남의 아이디어에 덧붙이거나 고쳐 발언 가능</td></tr></table><b>그 외 기법</b><table><tr><th>기법</th><th>내용</th></tr><tr><td>역할연기(Role Playing)</td><td>실제 상황처럼 역할을 맡아 연기 → 태도·인간관계 훈련</td></tr><tr><td>사례연구(Case Study)</td><td>실제 사례를 분석·토의 → 문제해결 능력</td></tr><tr><td>인바스켓(In-Basket)</td><td>결재함에 쌓인 서류를 제한시간 안에 처리 → 의사결정 훈련</td></tr><tr><td>감수성 훈련(T-group)</td><td>소집단에서 자신과 타인의 감정·행동을 깨닫게 함</td></tr><tr><td>그리드 훈련</td><td>관리그리드 이론으로 (9,9)형 리더를 기름</td></tr><tr><td>행동모델링</td><td>모범 행동을 보고 따라 하며 익힘</td></tr></table>',
 ex:'<ul><li>위험예지훈련 1라운드에서 "어떤 위험이 있나" 아이디어를 마구 냄 → 브레인스토밍</li></ul>',
 exam:'<ul><li>브레인스토밍 원칙에 해당하지 <b>않는</b> 것 (예: "비판 허용", "소량 발언")</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g6',title:'6. 안전보건교육방법 (TWI · MTP · ATT · CCS · OJT · Off JT)',
 core:'TWI {{감독자}} 대상 {{JIT·JMT·JRT·JST}} / MTP {{관리자}} / ATT {{대상 제한 없음}} / CCS {{최고경영자}} / OJT {{현장 개별}} vs Off JT {{집합}}',
 def:'<ul><li><b>TWI(Training Within Industry)</b>: 감독자(현장 관리자)를 위한 정형화된 훈련 프로그램</li><li><b>OJT(On the Job Training)</b>: 일하면서 직속 상사가 개별 지도</li><li><b>Off JT(Off the Job Training)</b>: 업무를 떠나 집합교육</li></ul>',
 detail:'<b>TWI 4개 과정</b> (감독자 대상, 1회 2시간 × 5일 = 10시간)<table><tr><th>과정</th><th>내용</th></tr><tr><td>{{JIT}} (Job Instruction)</td><td>작업지도 기법</td></tr><tr><td>{{JMT}} (Job Methods)</td><td>작업개선 기법</td></tr><tr><td>{{JRT}} (Job Relations)</td><td>인간관계 관리 기법 (부하 통솔)</td></tr><tr><td>{{JST}} (Job Safety)</td><td>작업안전 기법</td></tr></table><b>관리자 교육 프로그램</b><table><tr><th>프로그램</th><th>대상</th><th>특징</th></tr><tr><td>{{MTP}} (Management Training Program)</td><td>TWI보다 상위 관리자</td><td>1회 2시간 × 20회 = 40시간, 관리 기능·조직·통제</td></tr><tr><td>{{ATT}} (American Telephone & Telegraph)</td><td>대상 계층 제한 없음</td><td>토의식, 1차 훈련 1일 8시간씩 2주, 2차 문제 발생 시</td></tr><tr><td>{{CCS}} (Civil Communication Section)</td><td>최고경영자</td><td>정책 수립·조직·통제, 강의법·토의법</td></tr></table><b>OJT vs Off JT</b><table><tr><th></th><th>{{OJT}}</th><th>{{Off JT}}</th></tr><tr><td>방법</td><td>현장에서 직속 상사가 개별 지도</td><td>현장 밖 집합교육, 외부 전문 강사</td></tr><tr><td>장점</td><td>개개인 맞춤, 즉시 업무에 적용, 효과 바로 확인, 상사·부하 신뢰, 비용 적음</td><td>다수를 한 번에 통일적으로, 전문가 지도, 업무를 떠나 집중, 다른 직장 사람과 경험 교류</td></tr><tr><td>단점</td><td>지도자 능력에 좌우, 체계적 교육 어려움</td><td>업무 공백, 현장 적용까지 시간</td></tr></table>',
 ex:'<ul><li>선임 반장이 신입에게 기계 조작을 옆에서 가르침 → OJT, JIT 방식</li><li>외부 연수원 3일 관리감독자 교육 → Off JT</li></ul>',
 cmp:'<table><tr><th>JMT</th><th>JRT</th></tr><tr><td>작업 <b>방법</b> 개선(Methods)</td><td>사람 <b>관계</b>(Relations)</td></tr></table>',
 exam:'<ul><li>TWI 과정 이름과 내용 (JRT = 인간관계)</li><li>프로그램별 대상 (CCS = 최고경영자, ATT = 제한 없음)</li><li>OJT 장점 vs Off JT 장점 바꿔치기</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g7',title:'7. 학습목적의 3요소',
 core:'{{목표·주제·학습정도}} / 학습정도 4단계 {{인지 → 지각 → 이해 → 적용}}',
 def:'<ul><li>학습 목적을 정할 때 반드시 들어가야 하는 세 가지 요소</li></ul>',

 ex:'<ul><li>목표: 산소결핍 재해 0 / 주제: 밀폐공간 작업 절차 / 학습정도: 산소농도 측정을 직접 할 수 있을 때까지(적용)</li></ul>',
 exam:'<ul><li>3요소에 <b>속하지 않는</b> 것 (예: "학습방법", "교재")</li><li>학습정도 4단계 순서</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g8',title:'8. 교육법의 4단계',
 core:'{{도입(준비) → 제시(설명) → 적용(응용) → 확인(평가)}} / 강의식은 {{제시}}, 토의식은 {{적용}}에 시간을 가장 많이',
 def:'<ul><li>한 번의 교육(수업)을 진행하는 표준 순서</li></ul>',
 detail:'<table><tr><th>단계</th><th>내용</th><th>강의식(분)</th><th>토의식(분)</th></tr><tr><td>1. {{도입}}(준비)</td><td>마음의 준비, 학습 목적·동기 부여, 관심 유도</td><td>5</td><td>5</td></tr><tr><td>2. {{제시}}(설명)</td><td>작업·내용을 설명하고 보여 줌, 한 번에 하나씩</td><td><b>40</b></td><td>10</td></tr><tr><td>3. {{적용}}(응용)</td><td>직접 해 보게 함, 실습·토의</td><td>10</td><td><b>40</b></td></tr><tr><td>4. {{확인}}(평가)</td><td>이해·습득 여부 확인, 시험·질문</td><td>5</td><td>5</td></tr></table><span style="color:var(--sub);font-size:13px">※ 1시간 기준 시간 배분은 교재에서 흔히 쓰는 예시값입니다.</span>',
 ex:'<ul><li>사고 영상으로 시작(도입) → 절차 설명(제시) → 직접 해 보기(적용) → 퀴즈(확인)</li></ul>',
 exam:'<ul><li>4단계 순서</li><li>강의식에서 시간이 가장 많은 단계 = 제시, 토의식 = 적용</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g9',title:'9. 교육훈련의 평가방법',
 core:'평가 방법 {{관찰·면접·질문·평정법·테스트·노트·상호평가}} / 커크패트릭 4수준 {{반응 → 학습 → 행동 → 결과}}',
 def:'<ul><li>교육이 목표를 달성했는지 확인하는 방법</li></ul>',
 detail:'<b>평가 방법</b><ul><li>관찰, 면접, 질문, 평정법(척도로 평가), 테스트(시험), 노트, 상호평가, 결과 평가(재해율 변화 등)</li></ul><b>평가 대상별 적합한 방법</b><table><tr><th>평가 대상</th><th>적합한 방법</th></tr><tr><td>지식</td><td>시험(테스트), 질문</td></tr><tr><td>기능</td><td>관찰, 실기 테스트</td></tr><tr><td>태도</td><td>관찰, 면접, 평정법</td></tr></table><b>커크패트릭(Kirkpatrick) 4수준</b><ol><li>{{반응}}: 교육에 만족했는가 (설문)</li><li>{{학습}}: 지식·기능을 얻었는가 (시험)</li><li>{{행동}}: 현장에서 행동이 바뀌었는가 (관찰)</li><li>{{결과}}: 재해 감소 등 조직 성과로 이어졌는가</li></ol><b>평가의 기준</b>: 타당도, 신뢰도, 객관도, 실용도 (심리검사와 같음)',
 ex:'<ul><li>교육 3개월 뒤 보호구 착용률 관찰 → 행동 수준 평가</li></ul>',
 exam:'<ul><li>태도 평가에 적합한 방법 (관찰·면접)</li><li>4수준 순서</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g10',title:'10. 강의법',
 core:'{{다수}}에게 {{짧은 시간}}에 {{많은 내용}} / 단점 {{일방적·개별화 어려움·참여 낮음}} / {{도입·초기}} 단계에 적합',
 def:'<ul><li>강사가 말로 설명하고 학습자는 듣는 가장 일반적인 교육 방법</li></ul>',
 detail:'<table><tr><th>장점</th><th>단점</th></tr><tr><td>다수를 한 번에 교육<br>짧은 시간에 많은 내용 전달<br>시간 계획·통제가 쉬움<br>새로운 내용·개념 도입에 적합</td><td>일방적 전달, 학습자 참여 낮음<br>개인차 고려 어려움<br>기능·태도 교육에는 부적합<br>집중력 유지 어려움</td></tr></table><ul><li>적합한 경우: 교육 초기, 새 개념 소개, 대상자가 많을 때, 시간이 짧을 때</li></ul>',
 exam:'<ul><li>강의법 장점에 해당하지 <b>않는</b> 것 (예: "개인차 고려 용이", "참여도 높음")</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g11',title:'11. 토의법',
 core:'{{포럼}} 문제 제기 → 토의 / {{심포지엄}} 전문가 발표 → 질문 / {{패널}} 전문가끼리 토의 → 전원 참여 / {{버즈세션}} 6명 6분(6-6 회의)',
 def:'<ul><li>학습자가 서로 의견을 나누며 문제를 해결하는 방법. 이미 기초 지식이 있는 사람에게 적합합니다.</li></ul>',
 detail:'<table><tr><th>방식</th><th>내용</th></tr><tr><td>{{포럼(Forum)}}</td><td>새로운 자료나 교재를 제시하고 문제점을 피교육자가 제기하게 한 뒤, 다시 깊이 파고들어 토의</td></tr><tr><td>{{심포지엄(Symposium)}}</td><td>몇 사람의 전문가가 과제에 대한 견해를 발표한 뒤, 참가자가 의견·질문을 하게 함</td></tr><tr><td>{{패널 디스커션(Panel)}}</td><td>패널 멤버(전문가 4~5명)가 피교육자 앞에서 자유롭게 토의하고, 뒤에 피교육자 전원이 참여해 토의</td></tr><tr><td>{{버즈세션(Buzz)}}</td><td>6-6 회의: 6명씩 소집단으로 나눠 6분간 토의 후 종합</td></tr><tr><td>자유토의</td><td>주제에 대해 자유롭게 의견 교환</td></tr><tr><td>사례연구·역할연기</td><td>5-2 교육훈련기법 참고</td></tr></table><b>토의법 장단점</b><ul><li>장점: 참여·흥미 높음, 태도 변화에 효과적, 다양한 의견 교환</li><li>단점: 시간 많이 걸림, 인원 제한, 진행자 능력에 좌우</li><li>적합한 경우: 태도 교육, 기초 지식이 있는 대상, 문제해결</li></ul>',
 ex:'<ul><li>전문가 3명이 각각 위험성평가 방법을 발표한 뒤 청중 질문 → 심포지엄</li></ul>',
 cmp:'<table><tr><th>심포지엄</th><th>패널</th></tr><tr><td>전문가가 각자 <b>발표</b></td><td>전문가끼리 <b>토의</b></td></tr></table>',
 exam:'<ul><li>설명 문장을 보고 방식 이름 고르기 (가장 자주 나옴)</li><li>버즈세션 = 6-6</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g12',title:'12. 실연법',
 core:'이미 설명 들은 내용을 {{지도자 감독 아래 직접 연습}} → {{기능 숙달}}',
 def:'<ul><li>학습자가 이미 설명을 듣거나 시범을 본 내용을 교사의 지휘·감독 아래 직접 연습해 적용해 보는 방법</li></ul>',
 detail:'<ul><li>장점: 기능·기술 습득에 가장 효과적, 학습자가 직접 해 보므로 기억이 오래 감</li><li>단점: 시간·장비·비용이 많이 듦, 다수 교육이 어려움, 교사 1명이 볼 수 있는 인원 제한</li><li>적합한 경우: 기능교육(2단계), 장비 조작, 보호구 착용법</li></ul>',
 ex:'<ul><li>강사 시범 후 교육생이 직접 공기호흡기 착용 → 실연법</li></ul>',
 cmp:'<table><tr><th>시범</th><th>실연</th></tr><tr><td>강사가 보여 줌</td><td>학습자가 직접 해 봄</td></tr></table>',
 exam:'<ul><li>실연법 정의 고르기</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g13',title:'13. 프로그램학습법',
 core:'학습자가 {{자기 속도}}로 {{스스로}} 학습하는 {{개별 학습}} / 단점 {{교육 내용 고정·개발비·집단 사고 어려움}}',
 def:'<ul><li>학습 내용을 작은 단계로 나눈 프로그램(교재)을 학습자가 스스로 풀어 가며 즉시 피드백을 받는 방법</li></ul>',
 detail:'<ul><li>장점: 개인차 고려(자기 능력·속도), 즉시 확인·강화, 지도자 없이도 학습, 학습 진도 파악 쉬움</li><li>단점: 교육 내용이 고정되어 융통성 부족, 프로그램 개발에 시간·비용, 집단 사고·사회성 교육 어려움</li><li>원리: 작은 단계, 적극적 반응, 즉시 확인(피드백), 자기 진도</li></ul>',

{id:'g17',title:'17. 안전보건교육의 단계별 교육과정',

 def:'<ul><li>안전교육은 알고(지식) → 할 수 있고(기능) → 늘 하는(태도) 순서로 진행합니다.</li></ul>',
 why:'<ul><li>알아도 할 줄 모르면 소용없고, 할 줄 알아도 습관이 안 되면 결국 생략합니다. 마지막 태도교육이 가장 어렵고 중요합니다.</li></ul>',
 detail:'<table><tr><th>단계</th><th>목표</th><th>방법</th><th>내용</th></tr><tr><td>1. {{지식교육}}</td><td>안다</td><td>강의, 시청각</td><td>위험 인식, 법령·규정, 작업 위험성</td></tr><tr><td>2. {{기능교육}}</td><td>할 수 있다</td><td>시범, 실습(실연), 현장훈련</td><td>작업 방법, 장비 조작, 점검 방법</td></tr><tr><td>3. {{태도교육}}</td><td>늘 한다</td><td>토의, 역할연기, 지도·감독, 상담</td><td>안전 습관화, 작업 동기</td></tr></table><b>기능교육의 3원칙</b>: 준비, 위험작업의 규제, 안전작업의 표준화<br><b>태도교육의 기본 과정</b><ol><li>청취한다</li><li>이해·납득시킨다</li><li>모범을 보인다</li><li>권장한다</li><li>칭찬한다 / 벌을 준다</li></ol>',
 ex:'<ul><li>안전대 교육: 왜 필요한지(지식) → 걸고 푸는 법(기능) → 감독·칭찬으로 매번 걸게(태도)</li></ul>',
 exam:'<ul><li>단계 순서와 각 단계의 방법</li><li>태도교육 과정 순서</li></ul>',
 law:'법령 근거 없음(이론).'},

{id:'g19',title:'19. 교육과정별 교육시간 (현행)',tag:'법정',
 core:'정기: 사무·판매 {{매반기 6h}}, 그 외 {{매반기 12h}}, 관리감독자 {{연 16h}} / 채용 시 일용 {{1h}}·1개월 이하 {{4h}}·그 외 {{8h}} / 변경 시 {{1h·2h}} / 특별 {{2h·16h}} / 건설 기초 {{4h}}',
 def:'<ul><li>산업안전보건법 시행규칙 별표 4에 정한 근로자 안전보건교육의 최소 시간</li><li><b>2023년 개정으로 정기교육이 "매분기"에서 "매반기"로 바뀌었습니다.</b> 옛 교재·기출의 매분기 3시간·6시간은 현행과 다릅니다.</li></ul>',
 detail:'<table><tr><th>교육과정</th><th>대상</th><th>시간</th></tr><tr><td rowspan="4">{{정기교육}}</td><td>사무직 종사 근로자</td><td>매반기 {{6시간}} 이상</td></tr><tr><td>판매업무 직접 종사 근로자</td><td>매반기 {{6시간}} 이상</td></tr><tr><td>그 외 근로자</td><td>매반기 {{12시간}} 이상</td></tr><tr><td>관리감독자</td><td>연간 {{16시간}} 이상</td></tr><tr><td rowspan="3">{{채용 시}}</td><td>일용근로자, 1주일 이하 기간제</td><td>{{1시간}} 이상</td></tr><tr><td>1주일 초과 1개월 이하 기간제</td><td>{{4시간}} 이상</td></tr><tr><td>그 외 근로자</td><td>{{8시간}} 이상</td></tr><tr><td rowspan="2">{{작업내용 변경 시}}</td><td>일용근로자, 1주일 이하 기간제</td><td>{{1시간}} 이상</td></tr><tr><td>그 외 근로자</td><td>{{2시간}} 이상</td></tr><tr><td rowspan="3">{{특별교육}}</td><td>일용·1주일 이하 기간제 (타워크레인 신호작업 제외)</td><td>{{2시간}} 이상</td></tr><tr><td>일용·1주일 이하 기간제 중 타워크레인 신호작업</td><td>{{8시간}} 이상</td></tr><tr><td>그 외 근로자</td><td>{{16시간}} 이상 (최초 작업 전 4시간, 나머지 12시간은 3개월 이내 분할 가능), 단기·간헐 작업은 2시간 이상</td></tr><tr><td>{{건설업 기초안전보건교육}}</td><td>건설 일용근로자</td><td>{{4시간}} 이상</td></tr></table><ul><li>관리감독자: 전년도 무재해 사업장은 정기교육 시간을 줄일 수 있는 특례가 있음</li><li>원격교육은 일부만 시간으로 인정되는 등 세부 기준은 안전보건교육규정(고시)</li></ul><b>직무교육 (선임된 사람 대상)</b> <span style="color:var(--sub);font-size:13px">— 교재와 함께 확인</span><table><tr><th>대상</th><th>신규</th><th>보수</th></tr><tr><td>안전보건관리책임자</td><td>6시간 이상</td><td>6시간 이상</td></tr><tr><td>안전관리자, 보건관리자 등</td><td>34시간 이상</td><td>24시간 이상</td></tr><tr><td>안전보건관리담당자</td><td>—</td><td>8시간 이상</td></tr></table><ul><li>신규교육: 선임 후 3개월 이내 / 보수교육: 신규교육 이수 후 매 2년마다</li></ul>',
 ex:'<ul><li>사무직 10명 → 상반기 6시간, 하반기 6시간 = 연 12시간</li><li>1주일 계약 단기 아르바이트 → 채용 시 1시간</li></ul>',
 cmp:'<table><tr><th></th><th>일용·1주 이하</th><th>그 외</th></tr><tr><td>채용 시</td><td>1h</td><td>8h (1개월 이하 4h)</td></tr><tr><td>변경 시</td><td>1h</td><td>2h</td></tr><tr><td>특별</td><td>2h</td><td>16h</td></tr></table>',
 calc:'생산직 근로자 1명의 연간 정기교육 = 매반기 12h × 2 = <b>24시간</b>',
 exam:'<ul><li>표의 숫자를 바꾼 보기 (가장 많이 출제)</li><li><b>옛 기출 해설의 "매분기 3h/6h"는 현행 기준이 아님</b> — 문제 보기가 매반기인지 확인</li></ul>',
 law:'산업안전보건법 제29조·제31조·제32조, 시행규칙 제26조·별표 4(안전보건교육 교육과정별 교육시간). 2023.9.28 시행 개정본 기준.'},

 {k:'변경 1 · 2 / 특별 2 · 16',s:'"일 바뀌면 <b>1·2</b>, 위험한 일이면 <b>2·16</b> — 특별교육은 일용직 2, 정규직은 하루 8시간 × 2일 = 16"',m:'변경 {{1h·2h}} / 특별 {{2h·16h}} (타워크레인 신호 일용 {{8h}})'},
 {k:'건설 기초 4',s:'"건설은 <b>사</b>(4)방이 위험 — 기초 4시간"',m:'건설업 기초안전보건교육 {{4h}}'}],

g21:[

};
function mnBox(id){var a=MN[id];if(!a)return '';var h='<div class="mn"><div class="mnh">연상 암기</div>';a.forEach(function(x){h+='<div class="mni"><span class="mnk">'+x.k+'</span><div class="mns">'+x.s+'</div><div class="mnm">→ '+mk(x.m)+'</div></div>'});return h+'</div>';}
var st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
var round=1,maskOn=false,filterOn=false;
var items=DATA.filter(function(d){return d.id});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function g(id){if(!st[id])st[id]={r:[0,0,0,0,0],s:0,v:0};return st[id]}
function mk(t){return (t||'').replace(/\{\{(.+?)\}\}/g,'<span class="m">$1</span>')}

var HINTS={1:'1회독 · 이해: 8칸을 모두 펼쳐 읽습니다. 헷갈리면 「애매함」을 누르세요.',2:'2회독 · 구조화: 세부 내용과 비교표만 봅니다. 애매함은 노란 표시로 강조됩니다.',3:'3회독 · 인출: 핵심 단어가 가려집니다. 떠올린 뒤 눌러 확인하고, 틀리면 ★.',4:'4회독 · 약점: ★·애매함 항목만 다시 풉니다.',5:'5회독 · 초압축: 항목별 한 줄 요약만 가려서 훑습니다. 시험 직전용.'};

function render(){
  var o='',shown=0;
  document.body.classList.toggle('mask',maskOn);
  DATA.forEach(function(d){
    if(d.grp){o+='<h2 class="grp">'+d.grp.replace(/^\S+\s/,function(m){return m})+'</h2>';return}
    var s=g(d.id);
    if((filterOn||round===4)&&!(s.s||s.v))return;
    shown++;
    var open=round===1?ORDER:(round===5?[]:['detail','cmp']);
    var h='<div class="item'+(s.v?' vague':'')+'" id="'+d.id+'"><div class="ih"><div class="tt">'+d.title+(d.tag?'<span class="badge">'+d.tag+'</span>':'')+'</div><div class="chk">';
    for(var i=0;i<5;i++)h+='<label>'+(i+1)+'<input type="checkbox" data-id="'+d.id+'" data-r="'+i+'"'+(s.r[i]?' checked':'')+'></label>';
    h+='</div><div class="ic"><button data-act="v" data-id="'+d.id+'" class="'+(s.v?'on':'')+'">애매함</button><button data-act="s" data-id="'+d.id+'" class="'+(s.s?'on':'')+'">★</button></div></div>';
    h+='<div class="core"><b>핵심</b> · '+mk(d.core)+'</div>';
    h+=mnBox(d.id);
    if(round!==5){
      ORDER.forEach(function(k){
        if(!d[k])return;
        h+='<details'+(open.indexOf(k)>-1?' open':'')+'><summary>'+LABEL[k]+'</summary><div class="cb">'+mk(d[k])+'</div></details>';
      });
    }
    h+='</div>';o+=h;
  });
  if(!shown)o+='<div class="empty">표시할 항목이 없습니다. ★·애매함을 표시한 항목이 여기에 모입니다.</div>';
  document.getElementById('list').innerHTML=o;
  var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
  document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
  document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  document.getElementById('hint').textContent=HINTS[round];
  var rb=document.querySelectorAll('#rounds button');
  for(var i=0;i<rb.length;i++)rb[i].classList.toggle('on',i===round-1);
  document.getElementById('bMask').classList.toggle('on',maskOn);
  document.getElementById('bStar').classList.toggle('on',filterOn);
}

(function init(){
  var r=document.getElementById('rounds');
  for(var i=1;i<=5;i++){var b=document.createElement('button');b.innerHTML=i+'<span class="w">회독</span>';b.setAttribute('data-round',i);r.appendChild(b)}
  r.addEventListener('click',function(e){
    var bt=e.target.closest('button');var n=bt&&bt.getAttribute('data-round');if(!n)return;
    round=+n;maskOn=(round>=3);render();
  });
  document.getElementById('bMask').onclick=function(){maskOn=!maskOn;render()};
  document.getElementById('bStar').onclick=function(){filterOn=!filterOn;render()};
  document.getElementById('list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('m')&&document.body.classList.contains('mask')){t.classList.toggle('show');return}
    var a=t.getAttribute&&t.getAttribute('data-act');
    if(a){var s=g(t.getAttribute('data-id'));s[a]=s[a]?0:1;save();render()}
  });
  document.getElementById('list').addEventListener('change',function(e){
    var t=e.target;if(t.type!=='checkbox')return;
    var s=g(t.getAttribute('data-id'));s.r[+t.getAttribute('data-r')]=t.checked?1:0;save();
    var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
    document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
    document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  });
  render();
})();
</script>
</body>
