<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--sub:#5b6577;--line:#dfe3ea;--pri:#1f5fbf;--pri2:#e6effc;--warn:#fff4d6;--star:#e0a100;--ok:#1c8a4b;--mask:#1d2330}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 80px}
header{padding:12px 0 4px}

h1{font-size:18px;margin:0 0 2px}

.rounds button,.tools button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
.rounds button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}

.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}

.ih .tt{flex:1 1 220px;font-weight:700}

.badge{font-size:11px;background:var(--warn);color:var(--tx);padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:600}
.chk{display:flex;gap:3px;align-items:center}
.chk label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.chk input{margin:2px 0 0}
.ic button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:3px 8px;font-size:13px;cursor:pointer;margin-left:4px}
.ic button.on{color:var(--star);border-color:var(--star);font-weight:700}
.core{margin:0 14px 10px;padding:8px 12px;background:var(--pri2);border-radius:8px;font-size:14px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--pri);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";}
details[open]>summary:before{content:"▾ ";}
.cb{padding:2px 14px 12px}
.cb ul{margin:4px 0;padding-left:20px}
.cb table{border-collapse:collapse;width:100%;margin:6px 0;font-size:13.5px}
.cb th,.cb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.cb th{background:var(--pri2)}
.m{border-bottom:1px dotted var(--pri);font-weight:600}
body.mask .m{background:var(--mask);color:transparent;border-radius:3px;cursor:pointer;border-bottom:none;user-select:none}
body.mask .m.show{background:transparent;color:inherit;border-bottom:1px dotted var(--pri)}
.empty{text-align:center;color:var(--sub);padding:30px}
.mn{margin:0 14px 10px;padding:8px 12px;border-left:4px solid var(--star);border-radius:8px;background:var(--warn)}
.mnh{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.mni{padding:5px 0;border-top:1px dashed var(--line)}
.mni:first-of-type{border-top:none}
.mnk{display:inline-block;font-weight:700;background:var(--star);color:#1d2330;border-radius:6px;padding:0 7px;font-size:12.5px}
.mns{font-size:14px;margin:3px 0 2px}
.mnm{font-size:13px;color:var(--sub)}
.nav{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:6px 0 2px}
.nav a{color:var(--pri);text-decoration:none}
.nav a:hover{text-decoration:underline}
.nav .dis{color:var(--sub);opacity:.5}
footer{margin-top:30px;font-size:12.5px;color:var(--sub)}
@media (max-width:640px){
 h1{font-size:16px}
 .ctrl{padding:6px 0 4px}

 .tools .w{display:none}
 #prog{font-size:11.5px;white-space:nowrap}
 .ih{padding:10px 12px}
 .core{margin:0 12px 8px}
 .mn{margin:0 12px 8px}
 summary{padding:7px 12px}
 .cb{padding:2px 12px 10px}
}
@media (min-width:641px){
 body{font-size:17px}
 h1{font-size:20px}
 .meta,.hint,.ih .tt small{font-size:14.5px}
 .rounds button,.tools button,.ic button{font-size:15px}
 h2.grp{font-size:18px}
 .badge{font-size:13px}
 .chk label{font-size:14px}
 .core{font-size:16px}
 summary,.cb table{font-size:15.5px}
 .cb span[style*="font-size:13px"]{font-size:15px!important}
 .mnh{font-size:14px}
 .mnk{font-size:14.5px}
 .mns{font-size:16px}
 .mnm{font-size:15px}
 footer{font-size:14.5px}
}
</style>

{id:'d2',title:'2. 작업별 지급 보호구 · 안전인증/자율안전확인 대상',

 def:'<ul><li>물체의 낙하·비래, 추락, 감전으로부터 머리를 보호하는 보호구</li></ul>',
 why:'<ul><li>A(낙하·비래)는 모든 안전모의 기본이고, 여기에 B(추락)·E(전기)를 붙여 용도를 표시합니다. 기호의 뜻만 알면 종류 문제는 외울 필요가 없습니다.</li></ul>',
 detail:'<b>종류 (안전인증)</b><table><tr><th>종류</th><th>사용 구분</th><th>비고</th></tr><tr><td>{{AB}}</td><td>물체 낙하·비래 및 추락에 의한 위험 방지·경감</td><td>—</td></tr><tr><td>{{AE}}</td><td>물체 낙하·비래 위험 방지·경감, 머리 부위 감전 위험 방지</td><td>내전압성</td></tr><tr><td>{{ABE}}</td><td>물체 낙하·비래 및 추락 위험 방지·경감, 머리 부위 감전 위험 방지</td><td>내전압성</td></tr></table><ul><li>내전압성: <b>7,000V 이하</b>의 전압에 견디는 성질</li><li>기호: A = 낙하·비래, B = 추락, E = 전기(감전)</li></ul><b>구조</b><table><tr><th>부품</th><th>역할</th></tr><tr><td>모체</td><td>머리를 덮는 외피(쉘)</td></tr><tr><td>착장체</td><td>머리고정대·머리받침고리·머리받침끈 — 머리에 고정하고 충격을 분산</td></tr><tr><td>충격흡수재</td><td>충격 흡수 (추락용 B 타입에 필요)</td></tr><tr><td>턱끈</td><td>벗겨짐 방지</td></tr><tr><td>챙(차양)</td><td>햇빛·낙하물 차단</td></tr></table><ul><li>모체 표면 색은 밝고 선명할 것, 통기구멍은 AE·ABE(감전용)에는 두면 안 됨</li></ul>',
 ex:'<ul><li>전주 위 배전 작업 → 추락 + 감전 위험 = <b>ABE</b></li><li>지상 변전설비 점검 → 낙하물 + 감전 = <b>AE</b></li><li>고층 철골 작업 → 낙하물 + 추락 = <b>AB</b></li></ul>',
 cmp:'<table><tr><th></th><th>AB</th><th>AE</th><th>ABE</th></tr><tr><td>추락</td><td>○</td><td>×</td><td>○</td></tr><tr><td>감전</td><td>×</td><td>○</td><td>○</td></tr><tr><td>내수성·내전압 시험</td><td>×</td><td>○</td><td>○</td></tr></table>',
 exam:'<ul><li>종류별 용도 짝짓기 (특히 AE에 "추락" 넣은 오답)</li><li>착장체 구성품</li><li>"내전압성은 7,000V 이하" (시험 전압 20kV와 구분 → 성능시험 카드)</li></ul>',
 law:'보호구 안전인증 고시 별표 1(안전모의 성능기준).'},

{id:'d4',title:'4. 안전화 · 안전장갑(절연장갑)',
 core:'안전화 {{가죽제·고무제·정전기·발등·절연화·절연장화·화학물질용}} / 절연장갑 {{00 갈·0 빨·1 흰·2 노·3 녹·4 등}}',
 def:'<ul><li><b>안전화</b>: 물체의 낙하·충격, 날카로운 물체에 찔림, 감전·정전기 등으로부터 발을 보호</li><li><b>안전장갑</b>: 전기용 절연장갑, 유기화합물용 장갑 등으로 손을 보호</li></ul>',
 why:'<ul><li>위험 종류(충격·찔림·전기·화학)에 따라 재질과 구조가 달라서, 작업과 안전화 종류를 짝짓는 문제가 나옵니다.</li></ul>',
 detail:'<b>안전화 종류</b><table><tr><th>종류</th><th>용도</th></tr><tr><td>가죽제 안전화</td><td>물체 낙하·충격, 날카로운 것에 찔림 방지</td></tr><tr><td>고무제 안전화</td><td>위 기능 + 방수·내화학성</td></tr><tr><td>정전기 안전화</td><td>정전기의 인체 대전 방지</td></tr><tr><td>발등 안전화</td><td>발등까지 보호</td></tr><tr><td>절연화</td><td>저압 전기 감전 방지</td></tr><tr><td>절연장화</td><td>고압 전기 감전 방지</td></tr><tr><td>화학물질용 안전화</td><td>화학물질로부터 발 보호</td></tr></table><b>안전화 작업 구분 (성능시험 기준)</b><table><tr><th>구분</th><th>내충격성(낙하높이)</th><th>내압박성</th></tr><tr><td>중작업용</td><td>{{1,000mm}}</td><td>15.0kN</td></tr><tr><td>보통작업용</td><td>{{500mm}}</td><td>10.0kN</td></tr><tr><td>경작업용</td><td>{{250mm}}</td><td>4.4kN</td></tr></table><b>내전압용 절연장갑 등급</b><table><tr><th>등급</th><th>최대사용전압(교류)</th><th>색상</th></tr><tr><td>00</td><td>500V</td><td>{{갈색}}</td></tr><tr><td>0</td><td>1,000V</td><td>{{빨간색}}</td></tr><tr><td>1</td><td>7,500V</td><td>{{흰색}}</td></tr><tr><td>2</td><td>17,000V</td><td>{{노란색}}</td></tr><tr><td>3</td><td>26,500V</td><td>{{녹색}}</td></tr><tr><td>4</td><td>36,000V</td><td>{{등색}}</td></tr></table>',
 ex:'<ul><li>반도체 공장(정전기에 민감) → 정전기 안전화</li><li>중량물 취급 철강 공장 → 중작업용 가죽제 안전화</li></ul>',
 cmp:'<table><tr><th>절연화</th><th>절연장화</th></tr><tr><td>저압용</td><td>고압용</td></tr></table>',
 exam:'<ul><li>절연장갑 등급 색상 순서 (암기: <b>갈·빨·흰·노·녹·등</b>)</li><li>안전화 중·보통·경작업용 낙하높이</li></ul>',
 law:'보호구 안전인증 고시 별표 2(안전화), 별표 3(안전장갑). <span style="color:var(--sub)">절연장갑 전압·안전화 시험값은 교재 기준과 함께 확인 권장.</span>'},

{id:'d5',title:'5. 호흡용 보호구 (방진·방독·송기)',
 core:'산소 {{18% 미만}} → 방진·방독 사용 금지, {{송기마스크·공기호흡기}} / 방진 등급 {{특급·1급·2급}} / 정화통 {{유기 갈색·할로겐·황화수소·시안화수소 회색·아황산 노랑·암모니아 녹색}}',
 def:'<ul><li><b>방진마스크</b>: 분진·미스트·흄을 필터로 걸러냄</li><li><b>방독마스크</b>: 유해가스·증기를 정화통(흡수제)으로 제거</li><li><b>송기마스크</b>: 외부의 깨끗한 공기를 호스로 공급 (공기 정화가 아니라 공급)</li></ul>',
 why:'<ul><li>방진·방독은 주변 공기를 <b>걸러서</b> 마시는 방식이라 산소 자체가 부족하면 소용이 없습니다. 그래서 산소결핍 장소는 반드시 공기를 <b>공급</b>하는 송기마스크나 공기호흡기를 씁니다.</li></ul>',
 detail:'<b>방진마스크</b><ul><li>형태: 분리식(격리식·직결식, 전면형·반면형), 안면부 여과식</li></ul><table><tr><th>등급</th><th>분진포집효율(분리식)</th><th>안면부여과식</th><th>사용 장소</th></tr><tr><td>{{특급}}</td><td>{{99.95%}} 이상</td><td>99.0% 이상</td><td>베릴륨 등 독성이 강한 물질 분진, 석면 취급 장소</td></tr><tr><td>{{1급}}</td><td>{{94.0%}} 이상</td><td>94.0% 이상</td><td>특급 외 분진, 금속흄 등 열적으로 생기는 분진, 기계적으로 생기는 분진</td></tr><tr><td>{{2급}}</td><td>{{80.0%}} 이상</td><td>80.0% 이상</td><td>특급·1급 외 분진</td></tr></table><ul><li>선정 기준: 분진포집효율 <b>높고</b>, 흡기·배기 저항 <b>낮고</b>, 사용적(유효공간) <b>작고</b>, 중량 가볍고, 시야 넓고, 안면 밀착성 좋을 것</li></ul><b>방독마스크</b><table><tr><th>종류</th><th>시험가스</th><th>정화통 색</th></tr><tr><td>유기화합물용</td><td>시클로헥산</td><td>{{갈색}}</td></tr><tr><td>할로겐용</td><td>염소가스·증기</td><td>{{회색}}</td></tr><tr><td>황화수소용</td><td>황화수소</td><td>{{회색}}</td></tr><tr><td>시안화수소용</td><td>시안화수소</td><td>{{회색}}</td></tr><tr><td>아황산용</td><td>아황산가스</td><td>{{노란색}}</td></tr><tr><td>암모니아용</td><td>암모니아</td><td>{{녹색}}</td></tr></table><ul><li>복합용: 해당 가스 색을 모두 표시(2층 분리) / 겸용: 백색과 해당 가스 색</li><li>등급: 고농도(가스 2% 이하, 암모니아 3% 이하), 중농도(1% 이하, 암모니아 1.5% 이하), 저농도·최저농도(0.1% 이하)</li><li><b>파과</b>: 정화통이 포화되어 유해가스가 새어 나오기 시작하는 상태 → 파과 전에 교체</li><li><span style="color:var(--sub)">일산화탄소용(적색)은 구 기준·일부 교재에 나오는 항목</span></li></ul><b>송기마스크·공기호흡기</b><ul><li>송기마스크: 호스마스크, 에어라인마스크, 복합식 에어라인마스크</li><li>공기호흡기(자급식): 압축공기 용기를 메고 사용 — 화재 진압, 산소결핍 밀폐공간 구조</li><li>전동식 호흡보호구: 전동기로 여과된 공기를 공급 (방진·방독 기능)</li></ul>',
 ex:'<ul><li>맨홀(산소농도 16%) 내부 작업 → 방독마스크 <b>불가</b>, 송기마스크</li><li>도장 작업(톨루엔 등 유기용제) → 유기화합물용(갈색) 방독마스크</li><li>석면 해체 → 특급 방진마스크</li></ul>',
 cmp:'<table><tr><th></th><th>방진</th><th>방독</th><th>송기</th></tr><tr><td>대상</td><td>입자(분진·흄)</td><td>가스·증기</td><td>모든 경우</td></tr><tr><td>방식</td><td>여과</td><td>흡수·흡착</td><td>공기 공급</td></tr><tr><td>산소 18% 미만</td><td>×</td><td>×</td><td>○</td></tr></table>',
 calc:'→ 방독마스크 유효시간 계산은 「성능기준·시험」의 호흡보호구 카드에서',
 exam:'<ul><li>정화통 색 짝짓기 (특히 황화수소·시안화수소가 <b>회색</b>)</li><li>특급 99.95% 숫자</li><li>"산소결핍 장소에서 방독마스크 사용" → 틀림</li></ul>',
 law:'보호구 안전인증 고시 별표 4(방진마스크), 별표 5(방독마스크), 별표 6(송기마스크), 안전보건규칙 제3편 제10장(밀폐공간).'},

{id:'d6',title:'6. 안전대',
 core:'벨트식 {{1개걸이·U자걸이}} / 안전그네식 {{1개걸이·U자걸이·추락방지대·안전블록}} / 추락방지대·안전블록은 {{안전그네식만}}',
 def:'<ul><li>고소작업 중 추락을 막거나, 추락했을 때 충격을 줄여 몸을 잡아 주는 보호구</li><li><b>벨트식</b>: 허리에 차는 형태 / <b>안전그네식</b>: 어깨·허벅지까지 감싸 추락 충격을 몸 전체로 분산</li></ul>',
 why:'<ul><li>벨트식은 추락 시 충격이 허리에 집중되어 부상 위험이 크므로, 실제로 떨어질 수 있는 작업(추락방지대·안전블록)에는 안전그네식만 쓰게 합니다.</li></ul>',
 detail:'<b>종류 (안전인증)</b><table><tr><th>종류</th><th>사용 구분</th></tr><tr><td>벨트식</td><td>1개 걸이용, U자 걸이용</td></tr><tr><td>안전그네식</td><td>1개 걸이용, U자 걸이용, {{추락방지대}}, {{안전블록}}</td></tr></table><ul><li><b>1개 걸이</b>: 죔줄 한쪽 끝을 구조물에 걸어 추락 시 잡아 줌</li><li><b>U자 걸이</b>: 죔줄을 전주 등에 돌려 걸어 몸을 기대고 작업(전주 작업)</li><li><b>추락방지대</b>: 수직 구명줄을 따라 움직이다 추락하면 잠김</li><li><b>안전블록</b>: 줄이 자동 감기고, 추락 시 자동 잠김</li></ul><b>부품</b>: 벨트, 안전그네, 지탱벨트, 죔줄, 버클, D링, 각링, 8자형 링, 훅, 카라비너, 보조훅, 신축조절기, 충격흡수장치<ul><li>안전대 부착설비: 안전대를 걸 수 있는 견고한 구조물 또는 <b>구명줄</b></li></ul>',
 ex:'<ul><li>전주 위 배선 작업 → U자 걸이 (몸을 기대야 양손 작업 가능)</li><li>수직 사다리 승강 → 추락방지대 (안전그네식)</li></ul>',
 cmp:'<table><tr><th></th><th>벨트식</th><th>안전그네식</th></tr><tr><td>1개걸이·U자걸이</td><td>○</td><td>○</td></tr><tr><td>추락방지대·안전블록</td><td>×</td><td>○</td></tr></table>',
 exam:'<ul><li>"벨트식 추락방지대" → 존재하지 않음</li><li>U자 걸이 = 전주 작업</li><li><span style="color:var(--sub)">교재에 1종~5종 구분이 나오면 구 KS 기준(1종 U자걸이, 2종 1개걸이, 3종 공용, 4종 안전블록, 5종 추락방지대)</span></li></ul>',
 law:'보호구 안전인증 고시 별표 9(안전대), 안전보건규칙 제44조(안전대의 부착설비 등).'},

{id:'d7',title:'7. 보안경 · 보안면 · 귀마개 · 보호복',
 core:'차광보안경 {{자외선·적외선·복합·용접}} / 보안면 {{헬멧형·핸드실드형}} / 귀마개 {{EP-1 저음~고음, EP-2 고음}}, 귀덮개 {{EM}} / 방열복 {{상의·하의·두건·장갑·발덮개}}',
 def:'<ul><li><b>보안경</b>: 눈을 유해광선·비산물로부터 보호 / <b>보안면</b>: 얼굴 전체 보호</li><li><b>귀마개·귀덮개</b>: 소음으로부터 청력 보호 / <b>보호복</b>: 고열(방열복)·화학물질로부터 몸 보호</li></ul>',
 detail:'<b>보안경</b><ul><li>차광보안경(안전인증): 자외선용, 적외선용, 복합용(자외선+적외선), 용접용</li><li>비산물 위험방지용: 유리 보안경, 플라스틱 보안경, 도수렌즈 보안경 (일반용은 자율안전확인)</li><li>차광도 번호: 숫자가 클수록 빛을 많이 차단</li></ul><b>용접용 보안면</b><ul><li>헬멧형(머리에 착용), 핸드실드형(손으로 들고 사용)</li></ul><b>방음용 귀마개·귀덮개</b><table><tr><th>종류</th><th>등급</th><th>성능</th></tr><tr><td rowspan="2">귀마개</td><td>{{1종 EP-1}}</td><td>저음부터 고음까지 차음</td></tr><tr><td>{{2종 EP-2}}</td><td>주로 고음 차음, 회화음 영역(저음)은 비교적 통과</td></tr><tr><td>귀덮개</td><td>{{EM}}</td><td>귀 전체를 덮음</td></tr></table><ul><li>소음이 매우 크면 귀마개와 귀덮개를 함께 착용</li></ul><b>보호복</b><ul><li>방열복: 방열상의, 방열하의, 방열일체복, 방열장갑, 방열두건</li><li>화학물질용 보호복: 화학물질 투과 방지</li></ul>',
 ex:'<ul><li>아크용접 → 용접용 차광보안경 또는 용접용 보안면</li><li>대화가 필요한 고음 소음 작업 → EP-2</li><li>제철소 용해로 → 방열복</li></ul>',
 cmp:'<table><tr><th></th><th>EP-1</th><th>EP-2</th></tr><tr><td>차음 범위</td><td>저음~고음</td><td>고음 위주</td></tr><tr><td>대화</td><td>어려움</td><td>상대적으로 가능</td></tr></table>',
 exam:'<ul><li>EP-1과 EP-2 성능 바꾸기 함정</li><li>귀덮개 기호 EM</li><li>차광보안경 4종류</li></ul>',
 law:'보호구 안전인증 고시 별표 10(차광보안경), 별표 11(용접용 보안면), 별표 12(방음용 귀마개·귀덮개), 별표 8(보호복).'},

{grp:'2-3. 보호구의 성능기준 및 시험방법'},
{id:'d8',title:'8. 안전모 성능시험',
 core:'내관통성 {{AE·ABE 9.5mm, AB 11.1mm}} 이하 / 충격흡수성 {{4,450N}} 미만 / 내전압성 {{교류 20kV 1분}}, 충전전류 {{10mA}} 이하 / 내수성 질량증가율 {{1% 미만}} / 난연성 {{5초}} / 턱끈풀림 {{150~250N}}',
 def:'<ul><li>안전인증을 받으려면 통과해야 하는 시험 항목과 기준값</li></ul>',
 why:'<ul><li>각 시험은 안전모 기능에 대응합니다: 뚫리지 않는가(내관통), 충격을 줄이는가(충격흡수), 전기를 막는가(내전압), 물에 젖어도 절연이 유지되는가(내수), 불에 타지 않는가(난연), 턱끈이 적당히 풀리는가(턱끈풀림 — 너무 안 풀리면 목을 다침).</li></ul>',
 detail:'<table><tr><th>시험</th><th>기준</th><th>대상</th></tr><tr><td>{{내관통성}}</td><td>관통거리 AE·ABE {{9.5mm 이하}}, AB {{11.1mm 이하}}</td><td>전 종류</td></tr><tr><td>{{충격흡수성}}</td><td>최고전달충격력 {{4,450N 미만}}, 모체·착장체 기능 상실 없음</td><td>전 종류</td></tr><tr><td>{{내전압성}}</td><td>교류 {{20kV}}에서 {{1분간}} 절연파괴 없이 견디고, 충전전류 {{10mA 이하}}</td><td>AE·ABE</td></tr><tr><td>{{내수성}}</td><td>질량증가율 {{1% 미만}}</td><td>AE·ABE</td></tr><tr><td>{{난연성}}</td><td>모체가 불꽃을 내며 {{5초 이상}} 연소되지 않을 것</td><td>전 종류</td></tr><tr><td>{{턱끈풀림}}</td><td>{{150N 이상 250N 이하}}에서 풀릴 것</td><td>전 종류</td></tr></table><ul><li>내수성 질량증가율 = (담근 후 질량 − 담그기 전 질량) ÷ 담그기 전 질량 × 100</li></ul>',
 cmp:'<table><tr><th>숫자</th><th>의미</th></tr><tr><td>7,000V</td><td>AE·ABE가 <b>사용 가능한</b> 전압 한계</td></tr><tr><td>20kV</td><td>내전압성 <b>시험</b> 전압</td></tr><tr><td>10mA</td><td>시험 중 허용 충전전류</td></tr></table>',
 calc:'담그기 전 400g, 담근 후 403g → (403−400)÷400×100 = <b>0.75%</b> → 1% 미만이므로 합격.',
 exam:'<ul><li>내관통성 AB가 더 큰 값(11.1mm)인 이유: AB는 감전 보호가 없어 기준이 조금 완화</li><li>내전압성·내수성은 <b>AE·ABE만</b> 시험</li><li>질량증가율 계산 문제</li></ul>',
 law:'보호구 안전인증 고시 별표 1. <span style="color:var(--sub)">시험값은 고시 개정 여부를 교재와 함께 확인.</span>'},

{id:'d9',title:'9. 호흡보호구 성능 · 유효시간 계산',
 core:'유효시간 = {{표준유효시간 × 시험가스농도 ÷ 공기 중 유해가스농도}} / 방진 성능 = {{포집효율·흡기/배기저항·누설률}}',
 def:'<ul><li><b>파과시간</b>: 시험가스를 흘렸을 때 정화통을 통과한 가스가 기준 농도에 도달하기까지의 시간</li><li><b>유효시간</b>: 실제 작업장 농도에서 정화통을 쓸 수 있는 시간</li></ul>',
 why:'<ul><li>정화통은 흡수할 수 있는 가스의 총량이 정해져 있어서, 농도가 높을수록 빨리 포화됩니다. 그래서 시간은 농도에 <b>반비례</b>합니다.</li></ul>',
 detail:'<b>방독마스크 정화통 유효시간</b><ul><li>유효사용시간 = (표준유효시간 × 시험가스 농도) ÷ 공기 중 유해가스 농도</li></ul><b>방진마스크 주요 성능 항목</b><ul><li>분진포집효율(여과효율): 특급 99.95% / 1급 94% / 2급 80% 이상 (분리식)</li><li>흡기저항·배기저항: 낮을수록 숨쉬기 편함</li><li>안면부 누설률, 시야, 배기밸브 작동</li></ul><b>방독마스크 주요 성능 항목</b><ul><li>파과시간, 흡기·배기저항, 누설률, 시야</li></ul>',
 calc:'표준유효시간 100분, 시험가스 농도 0.5%, 작업장 유해가스 농도 0.2%<br>→ 100 × 0.5 ÷ 0.2 = <b>250분</b>',
 exam:'<ul><li>유효시간 공식에서 분자·분모 뒤바꾸기 (농도가 낮으면 시간이 <b>길어져야</b> 맞음 — 검산용)</li><li>방진마스크 등급별 포집효율</li></ul>',
 law:'보호구 안전인증 고시 별표 4·별표 5.'},

{id:'d10',title:'10. 안전화 · 절연장갑 · 귀마개 성능 요약',
 core:'안전화 내충격 {{1,000·500·250mm}}, 내압박 {{15·10·4.4kN}} / 절연장갑 최대사용전압 {{500·1,000·7,500·17,000·26,500·36,000V}}',
 detail:'<b>안전화</b><table><tr><th>구분</th><th>내충격성</th><th>내압박성</th></tr><tr><td>중작업용</td><td>1,000mm 높이 낙하</td><td>15.0kN</td></tr><tr><td>보통작업용</td><td>500mm</td><td>10.0kN</td></tr><tr><td>경작업용</td><td>250mm</td><td>4.4kN</td></tr></table><ul><li>그 외 시험: 내답발성(찔림 저항), 박리저항, 내유성, 정전기 안전화는 대전방지 성능, 절연화는 절연 성능</li></ul><b>절연장갑</b>: 등급 00~4, 높은 등급일수록 고전압용 (종류별 특성 카드의 표 참고)<br><b>귀마개·귀덮개</b>: 주파수별 차음치로 성능 평가, EP-1은 저음역 차음치도 요구',
 cmp:'<table><tr><th>규칙</th><th>기억법</th></tr><tr><td>중→보통→경</td><td>낙하높이 절반씩: 1,000 → 500 → 250</td></tr></table>',
 exam:'<ul><li>안전화 작업 구분별 낙하높이 숫자</li></ul>',
 law:'보호구 안전인증 고시 별표 2·3·12. <span style="color:var(--sub)">세부 시험값은 교재와 함께 확인.</span>'},

{grp:'2-4. 안전보건표지의 종류·용도 및 적용'},
{id:'d11',title:'11. 안전보건표지 종류와 형태',
 core:'금지 {{8}}·경고 {{15}}·지시 {{9}}·안내 {{8}} / 금지 {{빨간 원+사선}}, 경고 {{노란 삼각형}}(화학물질은 {{빨간 마름모}}), 지시 {{파란 원}}, 안내 {{녹색 사각형}}',
 def:'<ul><li>유해·위험 시설이나 장소의 경고, 비상시 조치 안내 등을 그림·기호·글자로 나타낸 표지</li></ul>',
 why:'<ul><li>말을 읽지 않아도 <b>모양과 색만 보고</b> 바로 알 수 있게 표준화한 것입니다. 그래서 시험은 "이 표지는 어느 분류인가"를 모양·색으로 묻습니다.</li></ul>',
 detail:'<b>금지표지 (8종)</b> — 흰 바탕, 빨간 원과 사선, 검은 그림<ul><li>출입금지, 보행금지, 차량통행금지, 사용금지, 탑승금지, 금연, 화기금지, 물체이동금지</li></ul><b>경고표지 (15종)</b><ul><li>노란 바탕 + 검은 삼각형 테두리·그림: 방사성물질, 고압전기, 매달린 물체, 낙하물, 고온, 저온, 몸균형 상실, 레이저광선, 위험장소</li><li>무색 바탕 + 빨간 마름모(검정도 가능) — <b>화학물질 경고</b>: 인화성물질, 산화성물질, 폭발성물질, 급성독성물질, 부식성물질, 발암성·변이원성·생식독성·전신독성·호흡기과민성물질</li></ul><b>지시표지 (9종)</b> — 파란 원, 흰 그림<ul><li>보안경 착용, 방독마스크 착용, 방진마스크 착용, 보안면 착용, 안전모 착용, 귀마개 착용, 안전화 착용, 안전장갑 착용, 안전복 착용</li></ul><b>안내표지 (8종)</b> — 녹색(또는 흰 바탕 녹색 그림)<ul><li>녹십자표지, 응급구호표지, 들것, 세안장치, 비상용기구, 비상구, 좌측비상구, 우측비상구</li></ul><b>출입금지표지 (3종)</b><ul><li>허가대상물질 작업장, 석면 취급·해체 작업장, 금지대상물질의 취급 실험실 등</li></ul>',
 ex:'<ul><li>도장 부스 입구: 화기금지(금지) + 인화성물질 경고(화학물질 경고) + 방독마스크 착용(지시)</li><li>비상 샤워 위치: 세안장치(안내)</li></ul>',
 cmp:'<table><tr><th>헷갈리는 표지</th><th>분류</th></tr><tr><td>금연·화기금지</td><td>금지</td></tr><tr><td>인화성물질</td><td>경고(화학물질, 빨간 마름모)</td></tr><tr><td>고온·저온</td><td>경고(노란 삼각형)</td></tr><tr><td>녹십자표지</td><td>안내</td></tr><tr><td>세안장치</td><td>안내 (지시 아님)</td></tr><tr><td>안전복 착용</td><td>지시</td></tr></table>',
 exam:'<ul><li>표지 그림을 보여주고 이름·분류 묻기</li><li>금지표지가 <b>아닌</b> 것 (예: "화기엄금"은 금지, "인화성물질"은 경고)</li><li>녹십자는 안내표지</li><li>종류 수(8·15·9·8). 오래된 자료에는 지시표지가 8종(안전복 착용 없음)으로 나오니 현행 9종으로 기억</li></ul>',
 law:'산업안전보건법 제37조, 시행규칙 제38조·별표 6(안전보건표지의 종류와 형태)·별표 7(용도·설치장소).'},

{id:'d12',title:'12. 안전보건표지 설치·제작 기준',
 core:'{{쉽게 알아볼 수 있는}} 장소·위치 / 흔들리거나 {{쉽게 파손되지 않게}} / 야간에는 {{야광·발광}} / 내용을 {{문자로 추가}} 가능',
 def:'<ul><li>표지를 어디에, 어떻게 붙이고 만드는지에 관한 기준</li></ul>',
 detail:'<ul><li>설치: 근로자가 쉽게 알아볼 수 있는 장소·시설·물체에 설치, 흔들리거나 쉽게 파손되지 않도록 견고하게 부착</li><li>건축물·기계 등에 직접 <b>도장</b>할 수 있음</li><li>야간에 필요한 표지는 <b>야광물질</b> 사용 등으로 쉽게 알아볼 수 있게</li><li>표지에 필요한 내용을 <b>문자로 추가</b> 표시 가능 (글자는 표지 크기와 비례)</li><li>외국인 근로자를 고용한 경우 그 나라 언어로 작성 (외국인고용법에 따른 근로자)</li><li>제작: 그림·부호의 크기는 표지 크기에 비례, 쉽게 변형·변색되지 않는 재료</li><li>표지 색은 다음 카드의 색도 기준을 따름</li></ul>',
 ex:'<ul><li>외국인 근로자가 많은 공장 → 한국어 표지와 함께 해당 언어로 표지</li></ul>',
 exam:'<ul><li>설치 기준에 맞지 <b>않는</b> 것 고르기 (예: "작업에 방해되지 않도록 잘 보이지 않는 곳에 설치")</li></ul>',
 law:'산업안전보건법 제37조, 시행규칙 제39조(설치 등)·제40조(제작)·별표 9(기본모형).'},

{grp:'2-5. 안전보건표지의 색채 및 색도기준'},
{id:'d13',title:'13. 색채·색도 기준과 용도',
 core:'빨강 {{7.5R 4/14}} 금지·화학경고 / 노랑 {{5Y 8.5/12}} 경고 / 파랑 {{2.5PB 4/10}} 지시 / 녹색 {{2.5G 4/10}} 안내 / 흰색 {{N9.5}} / 검정 {{N0.5}}',

var HINTS={1:'1회독 · 이해: 8칸을 모두 펼쳐 읽습니다. 헷갈리면 「애매함」을 누르세요.',2:'2회독 · 구조화: 세부 내용과 비교표만 봅니다. 애매함은 노란 표시로 강조됩니다.',3:'3회독 · 인출: 핵심 단어가 가려집니다. 떠올린 뒤 눌러 확인하고, 틀리면 ★.',4:'4회독 · 약점: ★·애매함 항목만 다시 풉니다.',5:'5회독 · 초압축: 항목별 한 줄 요약만 가려서 훑습니다. 시험 직전용.'};

function render(){
  var o='',shown=0;
  document.body.classList.toggle('mask',maskOn);
  DATA.forEach(function(d){
    if(d.grp){o+='<h2 class="grp">'+d.grp.replace(/^\S+\s/,function(m){return m})+'</h2>';return}
    var s=g(d.id);
    if((filterOn||round===4)&&!(s.s||s.v))return;
    shown++;
    var open=round===1?ORDER:(round===5?[]:['detail','cmp']);
    var h='<div class="item'+(s.v?' vague':'')+'" id="'+d.id+'"><div class="ih"><div class="tt">'+d.title+(d.tag?'<span class="badge">'+d.tag+'</span>':'')+'</div><div class="chk">';
    for(var i=0;i<5;i++)h+='<label>'+(i+1)+'<input type="checkbox" data-id="'+d.id+'" data-r="'+i+'"'+(s.r[i]?' checked':'')+'></label>';
    h+='</div><div class="ic"><button data-act="v" data-id="'+d.id+'" class="'+(s.v?'on':'')+'">애매함</button><button data-act="s" data-id="'+d.id+'" class="'+(s.s?'on':'')+'">★</button></div></div>';
    h+='<div class="core"><b>핵심</b> · '+mk(d.core)+'</div>';
    h+=mnBox(d.id);
    if(round!==5){
      ORDER.forEach(function(k){
        if(!d[k])return;
        h+='<details'+(open.indexOf(k)>-1?' open':'')+'><summary>'+LABEL[k]+'</summary><div class="cb">'+mk(d[k])+'</div></details>';
      });
    }
    h+='</div>';o+=h;
  });
  if(!shown)o+='<div class="empty">표시할 항목이 없습니다. ★·애매함을 표시한 항목이 여기에 모입니다.</div>';
  document.getElementById('list').innerHTML=o;
  var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
  document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
  document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  document.getElementById('hint').textContent=HINTS[round];
  var rb=document.querySelectorAll('#rounds button');
  for(var i=0;i<rb.length;i++)rb[i].classList.toggle('on',i===round-1);
  document.getElementById('bMask').classList.toggle('on',maskOn);
  document.getElementById('bStar').classList.toggle('on',filterOn);
}

(function init(){
  var r=document.getElementById('rounds');
  for(var i=1;i<=5;i++){var b=document.createElement('button');b.innerHTML=i+'<span class="w">회독</span>';b.setAttribute('data-round',i);r.appendChild(b)}
  r.addEventListener('click',function(e){
    var bt=e.target.closest('button');var n=bt&&bt.getAttribute('data-round');if(!n)return;
    round=+n;maskOn=(round>=3);render();
  });
  document.getElementById('bMask').onclick=function(){maskOn=!maskOn;render()};
  document.getElementById('bStar').onclick=function(){filterOn=!filterOn;render()};
  document.getElementById('list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('m')&&document.body.classList.contains('mask')){t.classList.toggle('show');return}
    var a=t.getAttribute&&t.getAttribute('data-act');
    if(a){var s=g(t.getAttribute('data-id'));s[a]=s[a]?0:1;save();render()}
  });
  document.getElementById('list').addEventListener('change',function(e){
    var t=e.target;if(t.type!=='checkbox')return;
    var s=g(t.getAttribute('data-id'));s.r[+t.getAttribute('data-r')]=t.checked?1:0;save();
    var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
    document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
    document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  });
  render();
})();
</script>
</body>
</html>
