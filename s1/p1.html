<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1과목 1. 산업재해예방 계획 수립</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--sub:#5b6577;--line:#dfe3ea;--pri:#1f5fbf;--pri2:#e6effc;--warn:#fff4d6;--star:#e0a100;--ok:#1c8a4b;--mask:#1d2330}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--tx:#e8ebf2;--sub:#9aa3b5;--line:#2c3240;--pri:#6ea3f5;--pri2:#223350;--warn:#3a3217;--star:#f2bf2e;--ok:#4cc27d;--mask:#e8ebf2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 80px}
header{padding:12px 0 4px}
.ctrl{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.ctrl .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 0 2px}
.meta{color:var(--sub);font-size:12.5px}
.rounds{display:flex;gap:4px}
.rounds button,.tools button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
.rounds button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0}
h2.grp{font-size:16px;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--pri)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.item.vague{border-color:var(--star);background:linear-gradient(var(--warn),var(--warn)) top/100% 4px no-repeat,var(--card)}
.ih{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;flex-wrap:wrap}
.ih .tt{flex:1 1 220px;font-weight:700}
.ih .tt small{display:block;font-weight:400;color:var(--sub);font-size:12.5px}
.badge{font-size:11px;background:var(--warn);color:var(--tx);padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:600}
.chk{display:flex;gap:3px;align-items:center}
.chk label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.chk input{margin:2px 0 0}
.ic button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:3px 8px;font-size:13px;cursor:pointer;margin-left:4px}
.ic button.on{color:var(--star);border-color:var(--star);font-weight:700}
.core{margin:0 14px 10px;padding:8px 12px;background:var(--pri2);border-radius:8px;font-size:14px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--pri);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";}
details[open]>summary:before{content:"▾ ";}
.cb{padding:2px 14px 12px}
.cb ul{margin:4px 0;padding-left:20px}
.cb table{border-collapse:collapse;width:100%;margin:6px 0;font-size:13.5px}
.cb th,.cb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.cb th{background:var(--pri2)}
.m{border-bottom:1px dotted var(--pri);font-weight:600}
body.mask .m{background:var(--mask);color:transparent;border-radius:3px;cursor:pointer;border-bottom:none;user-select:none}
body.mask .m.show{background:transparent;color:inherit;border-bottom:1px dotted var(--pri)}
.empty{text-align:center;color:var(--sub);padding:30px}
.mn{margin:0 14px 10px;padding:8px 12px;border-left:4px solid var(--star);border-radius:8px;background:var(--warn)}
.mnh{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.mni{padding:5px 0;border-top:1px dashed var(--line)}
.mni:first-of-type{border-top:none}
.mnk{display:inline-block;font-weight:700;background:var(--star);color:#1d2330;border-radius:6px;padding:0 7px;font-size:12.5px}
.mns{font-size:14px;margin:3px 0 2px}
.mnm{font-size:13px;color:var(--sub)}
.nav{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:6px 0 2px}
.nav a{color:var(--pri);text-decoration:none}
.nav a:hover{text-decoration:underline}
.nav .dis{color:var(--sub);opacity:.5}
footer{margin-top:30px;font-size:12.5px;color:var(--sub)}
@media (max-width:640px){
 h1{font-size:16px}
 .ctrl{padding:6px 0 4px}
 .ctrl .row{flex-wrap:nowrap;gap:4px}
 .rounds button,.tools button{padding:5px 8px;font-size:12.5px}
 .rounds .w{display:none}
 .tools .w{display:none}
 #prog{font-size:11.5px;white-space:nowrap}
 .ih{padding:10px 12px}
 .core{margin:0 12px 8px}
 .mn{margin:0 12px 8px}
 summary{padding:7px 12px}
 .cb{padding:2px 12px 10px}
}
@media (min-width:641px){
 body{font-size:17px}
 h1{font-size:20px}
 .meta,.hint,.ih .tt small{font-size:14.5px}
 .rounds button,.tools button,.ic button{font-size:15px}
 h2.grp{font-size:18px}
 .badge{font-size:13px}
 .chk label{font-size:14px}
 .core{font-size:16px}
 summary,.cb table{font-size:15.5px}
 .cb span[style*="font-size:13px"]{font-size:15px!important}
 .mnh{font-size:14px}
 .mnk{font-size:14.5px}
 .mns{font-size:16px}
 .mnm{font-size:15px}
 footer{font-size:14.5px}
}
</style>
</head>

<div class="wrap">

<script>
var KEY='ise-s1-p1-v1';
var LABEL={def:'① 정의',why:'② 원리·이유',detail:'③ 세부 내용',ex:'④ 현장 예시',cmp:'⑤ 헷갈리는 비교',calc:'⑥ 예제 풀이',exam:'⑦ 기출 포인트',law:'⑧ 법령 근거'};
var ORDER=['def','why','detail','ex','cmp','calc','exam','law'];

var DATA=[
{grp:'1-1. 안전관리'},
{id:'a1',title:'1. 안전과 위험의 개념',
 core:'위험성 = {{가능성×중대성}} / 재해예방 4원칙 {{손·원·예·대}} / 중대재해 = 사망1, 3개월↑ 요양 동시2, 부상·질병 동시10',
 def:'<ul><li><b>안전</b>: 위험이 없거나 허용 가능한 수준으로 관리된 상태</li><li><b>유해·위험요인(Hazard)</b>: 재해를 일으킬 수 있는 잠재 원인</li><li><b>위험성(Risk)</b>: 유해·위험요인이 실제 재해로 이어질 가능성과 그 피해 크기의 조합</li><li><b>사고(Accident)</b>: 의도하지 않게 일어난 일 / <b>재해(Loss)</b>: 사고로 인한 인명·재산 손실 / <b>아차사고(Near Miss)</b>: 손실 없이 지나간 사고</li></ul>',
 why:'<ul><li>위험을 0으로 만들 수 없으므로 <b>허용 가능한 위험 수준</b>까지 낮추는 것이 안전관리의 실제 목표입니다.</li><li>위험을 숫자로 비교해야 우선순위를 정해 예산·인력을 배분할 수 있어서 {{가능성(빈도)×중대성(강도)}}로 계량합니다.</li></ul>',
 detail:'<b>재해예방 4원칙 (하인리히)</b><table><tr><th>원칙</th><th>뜻</th></tr><tr><td>{{손실우연}}의 원칙</td><td>사고 결과(손실)의 크기·종류는 우연에 좌우됨 → 결과가 아니라 <b>사고 자체</b>를 막아야 함</td></tr><tr><td>{{원인연계}}의 원칙</td><td>사고에는 반드시 원인이 있고, 원인은 연쇄적(직접·간접)</td></tr><tr><td>{{예방가능}}의 원칙</td><td>천재지변을 제외한 모든 재해는 예방 가능</td></tr><tr><td>{{대책선정}}의 원칙</td><td>원인을 찾으면 반드시 대책이 있고, 선정해 적용할 수 있음</td></tr></table><b>중대재해 (산안법 시행규칙)</b><ul><li>사망자 {{1명 이상}} 발생</li><li>{{3개월 이상}} 요양이 필요한 부상자가 동시에 {{2명 이상}}</li><li>부상자 또는 직업성 질병자가 동시에 {{10명 이상}}</li></ul>',
 ex:'<ul><li>지게차 포크에 화물이 걸려 근로자가 다친 경우 → 피해가 경미했어도 같은 조건이면 사망도 가능했으므로 <b>손실우연</b>: 결과와 무관하게 원인(적재 불량)을 제거해야 함</li><li>이동식 사다리 흔들림을 보고도 넘어가면 <b>아차사고</b>가 쌓이다 실제 추락재해로 이어짐</li></ul>',
 cmp:'<table><tr><th>용어</th><th>핵심 차이</th></tr><tr><td>Hazard</td><td>잠재 요인(원인 자체)</td></tr><tr><td>Risk(위험성)</td><td>요인이 재해가 될 <b>가능성×크기</b></td></tr><tr><td>사고 vs 재해</td><td>사고=일어난 일, 재해=그로 인한 손실</td></tr><tr><td>아차사고</td><td>사고는 났으나 인명·재산 손실 없음</td></tr></table>',
 calc:'가능성 3, 중대성 4인 작업의 위험성 = 3×4 = <b>12</b>. 사업장 허용 기준이 9 이하라면 허용 불가이므로 감소대책 대상.<br><span style="color:var(--sub)">(곱셈식 외에 조합 매트릭스·덧셈식은 2과목 위험성평가에서 다룸)</span>',
 exam:'<ul><li>4원칙 이름과 뜻 짝짓기 (특히 <b>손실우연</b>을 "손실은 항상 필연"으로 바꿔 놓는 함정)</li><li>중대재해 3가지 기준의 숫자(1, 2, 10)와 "3개월 이상" 혼동</li><li>천재지변은 예방 가능 원칙의 <b>예외</b></li></ul>',
 law:'산업안전보건법 시행규칙 제3조(중대재해의 범위). 중대재해 발생 시 지체 없이 보고 의무(법 제54조).'},

{id:'a2',title:'2. 안전보건관리 제이론',
 core:'하인리히 {{1:29:300}} / 버드 {{1:10:30:600}} / 직접원인 {{불안전행동88·상태10·불가항력2}} / 하인리히는 {{3단계}} 제거, 버드는 {{관리 부족}}',
 def:'<ul><li><b>도미노 이론</b>: 재해는 원인들이 연쇄적으로 쓰러지는 것처럼 일어나므로 한 단계만 제거해도 재해를 막을 수 있다는 이론</li><li><b>하인리히 법칙</b>: 대형사고 1건 뒤에는 경미한 사고 29건, 무상해 사고 300건이 있다는 경험 통계</li></ul>',
 why:'<ul><li>하인리히는 <b>불안전한 행동·상태</b>를 직접원인으로 보고 이 단계를 제거하면 연쇄가 끊긴다고 봤습니다.</li><li>버드는 불안전 행동 뒤에 <b>관리 부족</b>이 있다고 보고, 경영층의 관리 문제가 근본 원인이라 했습니다.</li><li>숫자 법칙은 "큰 재해를 줄이려면 작은 사고·아차사고부터 관리해야 한다"는 근거입니다.</li></ul>',
 detail:'<table><tr><th>단계</th><th>하인리히</th><th>버드(최신)</th><th>아담스</th><th>웨버</th></tr><tr><td>1</td><td>사회적 환경·유전적 요소</td><td>{{통제 부족(관리)}}</td><td>관리구조 결함</td><td>유전과 환경</td></tr><tr><td>2</td><td>개인적 결함</td><td>기본원인(기원)</td><td>작전적 에러</td><td>인간의 실수</td></tr><tr><td>3</td><td>{{불안전 행동·상태}}</td><td>직접원인(징후)</td><td>전술적 에러</td><td>불안전 행동·상태</td></tr><tr><td>4</td><td>사고</td><td>접촉(사고)</td><td>사고</td><td>사고</td></tr><tr><td>5</td><td>재해(상해)</td><td>손실(상해)</td><td>상해·손해</td><td>상해</td></tr></table><ul><li>하인리히 법칙: 중상 1 : 경상 29 : 무상해 300</li><li>버드 법칙: 중상·폐질 1 : 경상 10 : 물적손실 30 : 무상해무손실 600</li><li>하인리히 직접원인 통계: 불안전한 행동 {{88%}}, 불안전한 상태 {{10%}}, 불가항력 {{2%}}</li><li>간접원인(2차 원인): 기술적·교육적·신체적·정신적·작업관리상 원인</li></ul><span style="color:var(--sub);font-size:13px">※ 이론가별 단계 명칭은 교재마다 표현이 약간 다릅니다. 시험에서는 "몇 단계가 핵심인가"와 "무엇이 첫 단계인가"를 주로 묻습니다.</span>',
 ex:'<ul><li>작업자가 안전모를 벗고 작업(불안전 행동)하다 낙하물에 부상 → 하인리히는 이 3단계를 제거(보호구 착용 강제)하면 재해 차단</li><li>같은 현장에서 한 달간 아차사고가 30건 보고되면 버드 법칙상 큰 사고 가능성이 높아진 신호로 해석</li></ul>',
 cmp:'<table><tr><th></th><th>하인리히</th><th>버드</th></tr><tr><td>핵심 원인</td><td>불안전 행동·상태</td><td>{{관리 부족}}</td></tr><tr><td>제거 대상</td><td>3단계</td><td>1단계(관리) 개선</td></tr><tr><td>비율</td><td>1 : 29 : 300</td><td>1 : 10 : 30 : 600</td></tr></table>',
 calc:'하인리히 법칙으로 무상해 사고가 600건 보고된 사업장에서 예상되는 경상 건수 = 600÷300×29 = <b>58건</b>, 중상 = 600÷300×1 = <b>2건</b>.',
 exam:'<ul><li>"버드의 도미노 이론에서 첫 단계는?" → 통제 부족(관리)</li><li>하인리히 5단계 중 제거해야 하는 단계 → 3단계</li><li>1:29:300 과 1:10:30:600 의 <b>주체·숫자 바꿔치기</b></li></ul>',
 law:'법령 근거 없음(이론 문제). 산업안전보건법은 사업주의 안전보건 조치 의무로 이론을 구체화함(법 제5조, 제38조·제39조).'},

{id:'a3',title:'3. 생산성과 경제적 안전도',
 core:'하인리히 직접:간접 = {{1:4}} / 버드 보험:비보험재산:기타 = {{1:5~50:1~3}} / 시몬즈 = 보험비 + {{비보험비(A·B·C·D 평균비용)}} / 콤페스 = {{공동비+개별비}}',
 def:'<ul><li><b>재해손실비용</b>: 재해로 발생하는 직접비와 간접비를 합친 금액</li><li><b>경제적 안전도</b>: 안전에 투자한 비용 대비 재해 감소로 얻는 경제적 효과 (안전은 비용이 아니라 투자)</li></ul>',
 why:'<ul><li>눈에 보이는 보상비(직접비)보다 생산 중단·설비 손상 같은 <b>간접비가 훨씬 크다</b>는 점을 보여주어 경영층의 안전투자 필요성을 설득하는 근거가 됩니다.</li><li>재해가 줄면 작업 중단이 줄어 생산성과 품질이 함께 올라가므로 안전과 생산은 대립하지 않습니다.</li></ul>',
 detail:'<table><tr><th>방식</th><th>내용</th></tr><tr><td>{{하인리히}}</td><td>총 재해비용 = 직접비 + 간접비, <b>직접비 : 간접비 = 1 : 4</b></td></tr><tr><td>{{시몬즈}}</td><td>총 비용 = 보험비용 + 비보험비용<br>비보험비용 = (휴업상해 건수×A) + (통원상해 건수×B) + (응급조치 건수×C) + (무상해사고 건수×D) (A~D는 각 평균비용)</td></tr><tr><td>{{버드}}</td><td>보험비 : 비보험 재산비용 : 비보험 기타 재산비용 = 1 : 5~50 : 1~3 (빙산 이론)</td></tr><tr><td>{{콤페스}}</td><td>총 재해비용 = 공동비용비 + 개별비용비</td></tr></table><b>직접비·간접비 예</b><ul><li>직접비: 요양급여, 휴업급여, 장해급여, 간병급여, 유족급여, 장례비 등 법정 보상비</li><li>간접비: 인적 손실(동료 작업 중단), 물적 손실(설비·재료 파손), 생산 손실, 특수 손실(벌금·소송), 기타(사기 저하·교체 인력 교육비)</li></ul>',
 ex:'<ul><li>프레스 협착 사고: 산재보험 요양·장해급여(직접비)는 눈에 보이지만, 라인 정지로 인한 납기 지연, 금형 손상, 신규 인력 교육, 노무 갈등은 대부분 간접비</li></ul>',
 cmp:'<table><tr><th>구분</th><th>직접비</th><th>간접비</th></tr><tr><td>성격</td><td>법정 보상비</td><td>그 외 모든 손실</td></tr><tr><td>크기(하인리히)</td><td>1</td><td>4</td></tr><tr><td>비유</td><td>빙산의 수면 위</td><td>수면 아래</td></tr></table>',
 calc:'직접비가 <b>1,500만원</b>이면 하인리히 방식에서 간접비 = 1,500×4 = 6,000만원, 총 재해손실비용 = 1,500 + 6,000 = <b>7,500만원</b>.',
 exam:'<ul><li>하인리히 1:4 에서 "직접비가 4"인 것처럼 <b>거꾸로</b> 쓰는 함정</li><li>시몬즈 방식의 비보험비용 구성(휴업·통원·응급·무상해) 4가지 나열</li><li>시몬즈·콤페스는 출제기준 문구에 없지만 계산·서술형으로 기출 다수 <span class="badge">기출 보충</span></li></ul>',
 law:'산재보험 급여 종류: 산업재해보상보험법 제36조(보험급여의 종류). 비용 산정 방식은 법령이 아닌 이론.'},

{id:'a4',title:'4. 재해예방활동기법',tag:'일부 기출보충',
 core:'사고예방 5단계 {{조직→사실발견→분석평가→시정책선정→시정책적용}} / 3E {{기술·교육·관리}} / KYT 4라운드 {{현상파악→본질추구→대책수립→목표설정}} / 무재해운동 3원칙 {{무·선취·참가}}',
 def:'<ul><li><b>사고예방대책의 기본원리 5단계</b>: 안전활동을 단계별로 추진하는 하인리히의 모델</li><li><b>위험예지훈련(KYT)</b>: 작업 전에 위험요인을 함께 찾아 대책을 세우는 훈련</li><li><b>무재해운동</b>: 근로자 참여로 재해 제로를 추구하는 자율 활동</li></ul>',
 why:'<ul><li>사고는 원인 분석 없이 대책을 세우면 재발하므로 <b>사실 → 분석 → 대책 → 적용</b> 순서를 지켜야 합니다.</li><li>현장 작업자가 직접 위험을 찾고 약속해야 실제 행동이 바뀌므로 KYT·무재해운동은 참가형으로 설계됩니다.</li></ul>',
 detail:'<b>사고예방대책 5단계</b><table><tr><th>단계</th><th>내용</th></tr><tr><td>1. {{안전관리조직}}</td><td>경영층 참여, 안전관리자 선임, 조직 구성, 계획 수립</td></tr><tr><td>2. {{사실의 발견}}</td><td>사고·작업 분석, 점검·검사, 안전회의, 면접·조사</td></tr><tr><td>3. {{분석·평가}}</td><td>사고 보고서 분석, 불안전 요소 발견, 교육훈련·인사 조정 파악</td></tr><tr><td>4. {{시정방법의 선정}}</td><td>기술 개선, 배치 조정, 교육 개선, 규정·수칙 개선, 안전운동 전개</td></tr><tr><td>5. {{시정책의 적용}}</td><td><b>3E</b> 적용: 기술(Engineering)·교육(Education)·관리(Enforcement)</td></tr></table><b>KYT 4라운드</b><ul><li>1R 현상파악(어떤 위험이 잠재하는가) → 2R 본질추구(이것이 위험의 포인트) → 3R 대책수립(어떻게 하겠는가) → 4R 목표설정(우리는 이렇게 한다)</li></ul><b>무재해운동 3원칙</b><ul><li>{{무(無)}}의 원칙: 모든 잠재 위험 요인 제거 / {{선취}}의 원칙: 사고 전에 미리 위험 발견·해결 / {{참가}}의 원칙: 전원이 협력하여 문제 해결</li></ul><b>그 외</b>: TBM(작업 전 대화), 지적확인(가리키며 호칭·확인), 터치 앤 콜, 안전제안제도',
 ex:'<ul><li>고소작업 전 TBM에서 "추락 위험, 안전대 걸이 위치 확인"을 구호로 외치고 손으로 가리켜 확인 → 지적확인</li><li>추락 재해 시정책: 기술(안전난간 설치), 교육(고소작업 교육), 관리(착용 감독·벌칙) 3E를 모두 적용</li></ul>',
 cmp:'<table><tr><th>구분</th><th>하인리히 5단계</th><th>KYT 4R</th></tr><tr><td>쓰임</td><td>사업장 안전관리 전체 흐름</td><td>작업 전 위험 예지 훈련</td></tr><tr><td>첫 단계</td><td>안전관리조직</td><td>현상파악</td></tr><tr><td>마지막</td><td>시정책 적용</td><td>목표설정</td></tr></table>',
 calc:'(계산 문제 없음) 순서 문제 예: "대책수립"은 5단계 중 몇 단계가 아니라 <b>KYT 3라운드</b>, 5단계의 "시정방법 선정"은 4단계.',
 exam:'<ul><li>5단계 순서 배열, 3단계(분석·평가) vs 4단계(선정) 위치 바꾸기</li><li>무재해운동 3원칙 중 선취를 "안전제일"과 같이 묶어 묻기</li><li>KYT·TBM·지적확인은 출제기준 문구에 없지만 기출 빈출 <span class="badge">기출 보충</span></li></ul>',
 law:'무재해운동은 법정 의무가 아닌 자율 활동. 위험성평가 등 법정 활동은 산업안전보건법 제36조.'},

{id:'a5',title:'5. KOSHA GUIDE',
 core:'한국산업안전보건공단이 제정·공표하는 {{기술지침}} / 법정 의무는 아니지만 {{권고·자율 이행 기준}} / 형식 {{분야기호-번호-연도}}',
 def:'<ul><li><b>KOSHA GUIDE</b>: 한국산업안전보건공단(KOSHA)이 법령 이행을 돕기 위해 만든 <b>기술 지침</b>으로, 산업별·분야별 안전보건 작업 방법과 기준을 담습니다.</li></ul>',
 why:'<ul><li>법령은 최소 기준만 정하므로, 구체적인 작업 방법·설계 기준은 지침으로 보완합니다.</li><li>사업주가 지침 수준 이상의 조치를 하면 법정 조치도 충족하기 쉬워 <b>자율 안전관리</b>를 돕습니다.</li></ul>',
 detail:'<ul><li>성격: 법적 강제력은 없는 {{기술상의 지침}} (고시는 법적 효력이 있는 것과 구별)</li><li>작성 주체: 한국산업안전보건공단</li><li>번호 체계: <b>분야기호-일련번호-제정(개정)연도</b> 형태 <span style="color:var(--sub)">(분야기호의 뜻은 공단 사이트에서 확인)</span></li><li>용도: 위험성평가, 공정안전, 기계·전기·화학·건설 작업 안전기준, 보건(유해물질) 관리 등 분야별 실무 기준 제시</li><li>활용: 안전보건관리규정·작업 표준 작성, 점검표 작성, 안전교육 자료의 근거</li></ul>',
 ex:'<ul><li>사업장이 신규 압력용기를 설치할 때 법령에 없는 세부 점검 항목을 공단 기술지침에서 가져와 자체 점검표에 반영</li></ul>',
 cmp:'<table><tr><th>구분</th><th>법령(법·시행령·규칙)</th><th>고시</th><th>KOSHA GUIDE</th></tr><tr><td>강제력</td><td>있음</td><td>있음(위임 범위)</td><td>{{권고}}</td></tr><tr><td>작성</td><td>국가</td><td>고용노동부 등</td><td>공단</td></tr></table>',
 calc:'(계산 문제 없음)',
 exam:'<ul><li>"KOSHA GUIDE는 법적 구속력이 있다" → <b>틀린 지문</b></li><li>작성 기관이 공단인지 고용노동부인지 묻는 문제</li></ul>',
 law:'산업안전보건법상 기술상의 지침 및 작업환경표준의 제정·공표 근거 조문(법 제13조)에 해당. <span style="color:var(--sub)">조문 번호는 개정 시 달라질 수 있어 시험 직전 확인 권장.</span>'},

{id:'a6',title:'6. 안전보건예산 편성 및 계상',
 core:'안전보건관리계획에 {{예산 포함}} / 항목: {{보호구·시설·교육·점검·보건}} / 건설업은 별도 {{산업안전보건관리비}}(5과목)',
 def:'<ul><li><b>예산 편성</b>: 안전보건 활동에 쓸 비용을 연간 계획에 반영하는 일</li><li><b>계상</b>: 법령 기준에 따라 공사·사업비 중 일정 금액을 안전보건 목적으로 따로 잡아 두는 것</li></ul>',
 why:'<ul><li>예산이 없으면 계획이 실행되지 않습니다. 경영층이 <b>재해손실비용(1-3)</b>을 근거로 안전 투자를 승인하게 만드는 단계입니다.</li></ul>',
 detail:'<ul><li>예산 편성 순서: 전년 실적·재해 분석 → 우선순위 항목 선정 → 항목별 소요 비용 산정 → 위원회 심의 → 확정·집행·사후 평가</li><li>주요 항목: 안전시설·방호장치, 보호구, 안전보건교육, 점검·검사·측정, 건강진단, 안전 캠페인·포상, 위험성평가·컨설팅</li><li>관리 원칙: 안전보건 목적 외 사용 금지, 사용 내역 증빙 보관</li><li>건설업은 공사 종류와 금액에 따라 <b>산업안전보건관리비를 의무 계상</b>하고 사용기준을 지켜야 함 (세부 요율·사용 항목은 5과목 건설공사 안전 관리)</li></ul>',
 ex:'<ul><li>제조업체가 연초 안전보건관리계획에 보호구 교체, 프레스 방호장치 개선, 법정 교육 비용을 항목별로 넣고 산업안전보건위원회에서 심의</li></ul>',
 cmp:'<table><tr><th>구분</th><th>일반 사업장</th><th>건설업</th></tr><tr><td>성격</td><td>자율 편성(계획에 포함)</td><td>{{의무 계상}}(관리비)</td></tr></table>',
 calc:'(1과목은 계산 거의 없음. 요율 계산은 5과목 "건설업 산업안전보건관리비 대상액 작성요령"에서)',
 exam:'<ul><li>출제 빈도는 낮은 편. 예산 항목에 <b>해당하지 않는 것</b> 고르기 유형</li></ul>',
 law:'건설업 산업안전보건관리비: 산업안전보건법 제72조와 고용노동부 고시. 일반 사업장 예산은 안전보건관리계획(1-2 안전보건관리규정·계획)에 포함.'},

{grp:'1-2. 안전보건관리 체제 및 운용 · ① 조직 구성'},
{id:'c0',title:'0. 한눈에 보기 — 누가, 언제, 무엇을',tag:'비교표',
 core:'지휘 = {{책임자}} / 현장 = {{관리감독자}} / 보좌 = {{안전·보건관리자}} / 소규모 = {{담당자(20~50명 미만)}} / 도급 = {{총괄책임자}}',
 def:'<ul><li>이 파트는 "직책 이름만 바꿔 놓은 보기"가 가장 많이 나옵니다. 먼저 직책별 <b>위치(라인·스태프)</b>와 <b>선임 기준</b>을 이 표로 잡고, 아래 개별 카드로 들어가세요.</li></ul>',
 detail:'<table><tr><th>직책</th><th>성격</th><th>선임·지정 기준(대표값)</th><th>한 줄 역할</th></tr><tr><td><b>안전보건관리책임자</b><br>법 제15조</td><td>라인 최상위(공장장·현장소장)</td><td>상시 {{50명}}·{{100명}}·{{300명}} 이상(업종별) / 건설 {{20억}} 이상</td><td>사업장 안전보건 <b>총괄</b>, 안전·보건관리자 지휘·감독</td></tr><tr><td><b>관리감독자</b><br>법 제16조</td><td>라인(반장·팀장·직장)</td><td>별도 인원 기준 없음 — 생산 부서를 <b>직접 지휘·감독하는 직위</b>면 해당</td><td>자기 부서 기계·보호구 점검, 착용 지도</td></tr><tr><td><b>안전관리자</b><br>법 제17조</td><td>스태프</td><td>상시 {{50명}} 이상 / 건설 {{50억}} 이상</td><td>안전 <b>기술적 보좌·지도·조언</b></td></tr><tr><td><b>보건관리자</b><br>법 제18조</td><td>스태프</td><td>상시 50명 이상(업종별) / 건설 일정 금액 이상</td><td>보건 기술적 보좌·지도·조언</td></tr><tr><td><b>안전보건관리담당자</b><br>법 제19조</td><td>겸직 가능</td><td>상시 {{20명 이상 50명 미만}}, 지정 {{5개 업종}}</td><td>안전·보건관리자 역할을 소규모에서 대신</td></tr><tr><td><b>안전보건총괄책임자</b><br>법 제62조</td><td>도급인 사업장 책임자가 겸함</td><td>수급인 포함 {{100명}} 이상(일부 50명) / 건설 {{20억}} 이상</td><td>원청·하청 근로자 통합 관리</td></tr></table>',
 cmp:'<table><tr><th>헷갈리는 쌍</th><th>구분 포인트</th></tr><tr><td>책임자 vs 총괄책임자</td><td>총괄책임자는 <b>새로 뽑지 않고</b> 도급인 사업장의 책임자를 지정</td></tr><tr><td>책임자 vs 안전관리자</td><td>책임자는 <b>지휘</b>, 안전관리자는 <b>보좌</b>(지휘권 없음)</td></tr><tr><td>안전관리자 vs 관리감독자</td><td>스태프 vs 라인, 조언 vs 직접 점검·지도</td></tr><tr><td>안전관리자 vs 담당자</td><td>50명 이상 vs 20~50명 미만(지정 업종)</td></tr></table>',
 exam:'<ul><li>"안전관리자는 안전보건관리책임자를 지휘한다" → 틀림 (거꾸로)</li><li>"안전보건총괄책임자는 별도로 선임한다" → 틀림</li></ul>'},

{id:'c1',title:'1. 안전보건관리조직 3형태',
 core:'라인형 {{100명 이하}} / 스태프형 {{100~1,000명}} / 라인·스태프형 {{1,000명 이상}} / 라인형 단점 {{전문지식 부족}}',
 def:'<ul><li><b>라인(직계)형</b>: 생산 계통(사장→공장장→반장→작업자)이 안전까지 그대로 맡는 형태</li><li><b>스태프(참모)형</b>: 안전 전담 부서(스태프)를 따로 두고, 스태프가 조언·기획을 하는 형태</li><li><b>라인·스태프(직계·참모)형</b>: 스태프가 기획·조언하고, 실행은 라인이 하는 혼합형</li></ul>',
 why:'<ul><li>작은 사업장은 명령 계통이 짧아 라인형이 빠르고 확실합니다. 커질수록 안전 전문지식이 필요해 스태프를 두고, 대규모에서는 스태프의 전문성과 라인의 실행력을 함께 쓰는 혼합형이 됩니다.</li></ul>',
 detail:'<table><tr><th>유형</th><th>규모</th><th>장점</th><th>단점</th></tr><tr><td>{{라인형}}</td><td>100명 이하</td><td>명령·지시 신속·정확, 안전지시 철저</td><td>안전 전문지식·기술 부족, 정보 부족, 라인 업무 과중</td></tr><tr><td>{{스태프형}}</td><td>100~1,000명</td><td>전문가가 안전 기획·조사·정보 제공, 경영자 조언</td><td>생산부서와 마찰·협조 곤란, 안전지시가 늦게 전달, 권한 다툼</td></tr><tr><td>{{라인·스태프형}}</td><td>1,000명 이상</td><td>안전 전문성 + 라인 실행력, 신속한 안전 정보 반영</td><td>명령 계통과 조언 계통이 섞여 혼동, 스태프 월권 우려</td></tr></table>',
 ex:'<ul><li>직원 60명 공장 → 공장장이 직접 안전 지시 = 라인형</li><li>직원 3,000명 제조사 → 안전팀이 기준·교육 기획, 각 라인이 실행 = 라인·스태프형</li></ul>',
 cmp:'<table><tr><th>질문</th><th>정답</th></tr><tr><td>안전 업무를 생산라인이 그대로 수행</td><td>라인형</td></tr><tr><td>"생산부서와의 마찰"이 단점</td><td>스태프형</td></tr><tr><td>"명령과 조언의 혼동"이 단점</td><td>라인·스태프형</td></tr></table>',
 calc:'직원 450명 → 100~1,000명 구간이므로 <b>스태프형</b>.',
 exam:'<ul><li>형태별 장단점 짝짓기, 규모(100·1,000) 숫자</li><li>"대규모 사업장에 가장 적합" → 라인·스태프형</li></ul>',
 law:'조직 형태는 이론(법정 구분 아님).'},

{id:'c2',title:'2. 안전보건관리책임자',
 core:'선임: 상시 {{50명}}(제조업 등)·{{300명}}(농업·금융·SW 등)·{{100명}}(그 밖) 이상 / 건설 {{20억}} 이상 / 업무 9가지 {{계·규·교·환·건·원·통·적·위}}',
 def:'<ul><li>사업장을 <b>실질적으로 총괄·관리하는 사람</b>(공장장, 현장소장 등). 안전보건 업무를 총괄하고 안전관리자·보건관리자를 <b>지휘·감독</b>합니다.</li></ul>',
 why:'<ul><li>안전은 결국 예산·인사·작업지시 권한이 있는 사람이 책임져야 실행되므로, 사업장 최고 책임자에게 총괄 책임을 둡니다.</li></ul>',
 detail:'<b>선임 대상 (시행령 별표 2)</b><table><tr><th>상시근로자</th><th>업종 예</th></tr><tr><td>{{50명 이상}}</td><td>토사석 광업, 식료품, 목재, 화학, 1차 금속, 금속가공, 전기장비, 기계·장비, 자동차·트레일러 제조업 등 대부분의 제조업, 자동차 수리업 등</td></tr><tr><td>{{300명 이상}}</td><td>농업, 어업, 소프트웨어 개발·공급업, 컴퓨터 프로그래밍·시스템 통합, 정보서비스업, 금융·보험업, 임대업(부동산 제외), 전문·과학·기술 서비스업(연구개발업 제외), 사업지원 서비스업, 사회복지 서비스업</td></tr><tr><td>{{100명 이상}}</td><td>위 업종과 건설업을 제외한 그 밖의 사업</td></tr><tr><td>건설업</td><td>공사금액 {{20억원 이상}}</td></tr></table><b>업무 9가지 (법 제15조)</b> — 두문자 <b>계·규·교·환·건·원·통·적·위</b><ol><li><b>계</b>: 산업재해 예방계획 수립</li><li><b>규</b>: 안전보건관리규정 작성·변경</li><li><b>교</b>: 안전보건교육</li><li><b>환</b>: 작업환경측정 등 작업환경 점검·개선</li><li><b>건</b>: 건강진단 등 건강관리</li><li><b>원</b>: 산업재해 원인 조사 및 재발 방지대책 수립</li><li><b>통</b>: 산업재해 통계 기록·유지</li><li><b>적</b>: 안전장치·보호구 구입 시 적격품 여부 확인</li><li><b>위</b>: 위험성평가 실시 등 (고용노동부령)</li></ol><ul><li>직무교육: 신규·보수 각 6시간 이상 (교육 파트에서 다시 정리)</li></ul>',
 ex:'<ul><li>근로자 70명 자동차 부품 공장 → 제조업 50명 이상이므로 공장장을 책임자로 선임</li><li>근로자 200명 소프트웨어 회사 → 300명 미만이므로 선임 의무 없음</li></ul>',
 cmp:'<table><tr><th></th><th>책임자 업무</th><th>안전관리자 업무</th></tr><tr><td>동사</td><td>수립·작성·<b>확인</b>·실시</td><td><b>보좌·지도·조언</b>·건의</td></tr><tr><td>예</td><td>적격품 여부 <b>확인</b></td><td>적격품 <b>선정</b>에 관한 보좌·조언</td></tr></table>',
 calc:'건설공사 15억 현장 → 20억 미만이므로 책임자 선임 의무 없음. 25억 → 선임 대상.',
 exam:'<ul><li>책임자 업무에 해당하지 <b>않는</b> 것: "근로자 건강진단 실시 결과 개인 상담"(보건관리자), "순회점검·지도"(안전관리자) 같은 보기</li><li>업종별 50·100·300명 구분, 건설 20억</li></ul>',
 law:'산업안전보건법 제15조, 시행령 제14조·별표 2.'},

{id:'c3',title:'3. 관리감독자',
 core:'생산 업무와 소속 직원을 {{직접 지휘·감독}}하는 부서장·직장·반장 / 업무: {{점검·보호구 지도·재해 보고·정리정돈·협조·위험성평가 참여}}',
 def:'<ul><li>경영조직에서 생산 관련 업무와 그 소속 직원을 <b>직접 지휘·감독하는 직위</b>에 있는 사람. 따로 "선임 인원 기준"이 있는 게 아니라 <b>직위</b>로 정해집니다.</li></ul>',
 why:'<ul><li>매일 작업자를 직접 보는 사람이 위험을 가장 먼저 알 수 있으므로 현장 안전의 1차 책임을 둡니다.</li></ul>',
 detail:'<b>업무 (시행령 제15조)</b><ol><li>기계·기구·설비의 안전·보건 점검 및 이상 유무 확인</li><li>소속 근로자의 작업복·보호구·방호장치 점검과 착용·사용에 관한 교육·지도</li><li>산업재해 보고 및 응급조치</li><li>작업장 정리·정돈 및 통로 확보 확인·감독</li><li>안전관리자·보건관리자·안전보건관리담당자·산업보건의의 지도·조언에 대한 협조</li><li>위험성평가: 유해·위험요인 파악 참여, 개선조치 시행 참여</li><li>그 밖에 고용노동부령으로 정하는 사항</li></ol><ul><li>유해·위험 작업(프레스, 크레인, 밀폐공간 등)별 관리감독자의 추가 직무는 「산업안전보건기준에 관한 규칙」 별표 2에 있음 → 3~6과목에서 작업별로 나옴</li><li>정기교육: 연간 {{16시간}} 이상 (교육 파트)</li></ul>',
 ex:'<ul><li>프레스 반장이 작업 시작 전 방호장치 작동을 확인하고, 보안경 미착용자를 지도 → 관리감독자 업무</li></ul>',
 cmp:'<table><tr><th>관리감독자</th><th>안전관리자</th></tr><tr><td>자기 부서를 <b>직접</b> 점검·지도</td><td>사업장 전체 <b>순회점검</b>·지도·조치 건의</td></tr><tr><td>재해 <b>보고·응급조치</b></td><td>재해 원인조사·분석 <b>보좌</b></td></tr></table>',
 exam:'<ul><li>관리감독자 업무 고르기 (보기에 "산재 통계 유지·관리" 같은 안전관리자 업무를 섞음)</li><li>관리감독자 정기교육 16시간</li></ul>',
 law:'산업안전보건법 제16조, 시행령 제15조.'},

{id:'c4',title:'4. 안전관리자',
 core:'선임: 상시 {{50명}} 이상 / 건설 {{50억}} 이상 / 전담: 상시 {{300명}} 이상, 건설 {{120억}}(토목 {{150억}}) 이상 / 선임 후 {{14일}} 이내 서류 제출',
 def:'<ul><li>사업장의 안전에 관해 사업주와 안전보건관리책임자를 <b>기술적으로 보좌</b>하고 관리감독자에게 <b>지도·조언</b>하는 사람 (스태프)</li></ul>',
 why:'<ul><li>책임자는 경영자라 기술 전문성이 부족할 수 있으므로 전문 자격을 가진 사람이 보좌하게 합니다. 규모가 크면 겸직으로는 부족해 <b>전담</b>을 요구합니다.</li></ul>',
 detail:'<b>선임 인원 (시행령 별표 3)</b><table><tr><th>구분</th><th>1명 이상</th><th>2명 이상</th></tr><tr><td>제조업·광업·자동차 수리 등</td><td>{{50명}} 이상</td><td>{{500명}} 이상</td></tr><tr><td>그 밖의 업종 대부분</td><td>50명 이상</td><td>1,000명 이상</td></tr><tr><td>건설업</td><td>공사금액 {{50억}} 이상 ~ 800억 미만</td><td>800억 이상 (이후 금액 구간별 증원)</td></tr></table><ul><li><b>전담</b>(다른 업무 겸직 금지): 상시 {{300명}} 이상, 건설 {{120억}} 이상(토목공사업 {{150억}} 이상)</li><li>300명 미만 사업장 등은 <b>안전관리전문기관에 위탁</b> 가능</li><li>선임하면 선임일부터 <b>14일 이내</b> 증명서류 제출</li><li>자격(별표 4) 예: 산업안전지도사, 산업안전산업기사 이상, 건설안전산업기사 이상, 4년제 안전 관련 학과 졸업자 등</li></ul><b>업무 (시행령 제18조)</b> — 대부분 "<b>보좌·지도·조언</b>"<ol><li>위원회·노사협의체 심의·의결 업무, 관리규정·취업규칙에서 정한 업무</li><li>위험성평가에 관한 보좌·지도·조언</li><li>안전인증·자율안전확인 대상 기계 등 구입 시 적격품 <b>선정</b> 보좌·조언</li><li>안전교육 실시 보좌·지도·조언</li><li>사업장 <b>순회점검</b>·지도 및 조치 건의</li><li>산업재해 원인 조사·분석·재발방지 기술적 보좌·지도·조언</li><li>산업재해 통계 유지·관리·분석 보좌·지도·조언</li><li>법령·규정 위반 근로자 조치 건의</li><li>업무 수행 내용의 기록·유지</li></ol>',
 ex:'<ul><li>근로자 320명 제조공장 → 1명 선임, 300명 이상이므로 <b>전담</b></li><li>공사금액 70억 아파트 현장 → 1명 선임, 120억 미만이라 전담 의무는 없음</li></ul>',
 cmp:'<table><tr><th>기준</th><th>선임</th><th>전담</th></tr><tr><td>상시근로자</td><td>50명</td><td>300명</td></tr><tr><td>건설 공사금액</td><td>50억</td><td>120억(토목 150억)</td></tr></table>',
 calc:'제조업 상시 600명 → 500명 이상이므로 안전관리자 <b>2명 이상</b>, 300명 이상이므로 <b>전담</b>.',
 exam:'<ul><li>건설업 선임 기준이 과거 120억 → 현행 <b>50억</b> (옛 기출 해설과 다를 수 있음)</li><li>안전관리자 업무 vs 책임자 업무 구분(확인 vs 보좌)</li><li>전담 기준 300명</li></ul>',
 law:'산업안전보건법 제17조, 시행령 제16조~제19조·별표 3·별표 4. 별표 3은 2024년 개정본 기준(2026년 시행 법령 확인).'},

{id:'c5',title:'5. 보건관리자 · 산업보건의',
 core:'보건관리자 = 보건 {{기술적 보좌}} / 산업보건의 = {{의사}}, 근로자 건강관리 자문 / 보건관리자가 {{의사}}면 산업보건의 안 둬도 됨',
 def:'<ul><li><b>보건관리자</b>: 근로자 건강·작업환경 등 보건에 관해 사업주·책임자를 기술적으로 보좌하고 관리감독자에게 지도·조언하는 사람</li><li><b>산업보건의</b>: 근로자 건강관리 등 보건관리자 업무를 지도하는 <b>의사</b></li></ul>',
 why:'<ul><li>안전(사고)과 보건(질병·유해물질)은 전문 분야가 달라 별도로 둡니다.</li></ul>',
 detail:'<ul><li>선임: 업종·상시근로자 수(대체로 50명 이상)와 건설 공사금액에 따라 정해짐 (시행령 별표 5) — <span style="color:var(--sub)">세부 인원표는 출제 빈도가 낮아 생략, 교재로 확인</span></li><li>자격 예: 산업보건지도사, 의사, 간호사, 산업위생관리산업기사 이상, 인간공학기사 이상 등</li><li>보건관리자 업무 예 (시행령 제22조): 위원회 심의 업무, 위험성평가 보좌, 물질안전보건자료(MSDS) 게시·비치 보좌, 보건교육 보좌, 건강진단 결과 사후관리, <b>의사·간호사인 경우 응급처치 등 의료행위</b>, 작업환경 점검, 국소배기장치 등 점검 보좌, 산재 통계 보좌</li><li>산업보건의: 상시 50명 이상 사업장에서 두되, <b>의사인 보건관리자를 둔 경우</b> 등은 제외</li></ul>',
 cmp:'<table><tr><th></th><th>안전관리자</th><th>보건관리자</th></tr><tr><td>대상</td><td>사고·기계·설비</td><td>질병·유해물질·작업환경</td></tr><tr><td>특유 업무</td><td>순회점검, 적격품 선정 보좌</td><td>MSDS, 건강진단 사후관리, 의료행위(의사·간호사)</td></tr></table>',
 exam:'<ul><li>"보건관리자 업무"에 MSDS·국소배기장치·건강진단 사후관리가 정답으로 자주 나옴</li></ul>',
 law:'산업안전보건법 제18조·제22조(산업보건의), 시행령 제20조~제23조·별표 5·별표 6.'},

{id:'c6',title:'6. 안전보건관리담당자',
 core:'상시 {{20명 이상 50명 미만}} / 5개 업종 {{제조·임업·하수폐수분뇨·폐기물·환경정화}} / {{1명 이상}}, 겸직 가능',
 def:'<ul><li>안전관리자·보건관리자 선임 의무가 없는 <b>소규모 사업장</b>에서 안전·보건 업무를 보좌하는 사람</li></ul>',
 why:'<ul><li>50명 미만 사업장에 재해가 많지만 전문 인력을 두기 어려워서, 위험 업종에 한해 최소 1명의 담당자를 두게 합니다.</li></ul>',
 detail:'<b>대상 (시행령 제24조)</b> — 상시근로자 {{20명 이상 50명 미만}}인 다음 5개 업종<ol><li>제조업</li><li>임업</li><li>하수·폐수 및 분뇨 처리업</li><li>폐기물 수집·운반·처리 및 원료 재생업</li><li>환경 정화 및 복원업</li></ol>두문자: <b>제·임·하·폐·환</b><ul><li>인원: 1명 이상, <b>다른 업무와 겸직 가능</b></li><li>자격: 안전관리자 또는 보건관리자 자격이 있거나, 고용노동부장관이 정하는 안전보건교육 이수자</li><li>업무: 안전보건교육, 위험성평가, 작업환경측정, 건강진단, 산재 원인조사·통계, 적격품 선정에 관한 <b>보좌·지도·조언</b></li><li>안전관리전문기관 등에 위탁 가능</li></ul>',
 ex:'<ul><li>근로자 30명 금속가공 공장(제조업) → 담당자 1명 필요, 생산과장이 겸직 가능</li><li>근로자 30명 도소매업 → 대상 업종 아님</li></ul>',
 cmp:'<table><tr><th></th><th>담당자</th><th>안전관리자</th></tr><tr><td>규모</td><td>20~50명 미만</td><td>50명 이상</td></tr><tr><td>업종</td><td>5개 지정 업종만</td><td>대부분 업종</td></tr><tr><td>겸직</td><td>가능</td><td>300명 이상은 전담</td></tr></table>',
 exam:'<ul><li>대상 업종이 <b>아닌</b> 것 고르기 (건설업, 도소매업 등이 오답 보기로 나옴)</li><li>"20명 이상 50명 미만" 경계</li></ul>',
 law:'산업안전보건법 제19조, 시행령 제24조·제25조.'},

{id:'c7',title:'7. 안전관리자 등의 증원·교체 명령',
 core:'① 재해율 {{업종 평균 2배}} 이상 ② 중대재해 연간 {{2건}} 이상 ③ 관리자가 {{3개월}} 이상 직무 불능 ④ 화학적 인자 직업성 질병자 연간 {{3명}} 이상',
 def:'<ul><li>지방고용노동관서의 장이 안전관리자·보건관리자·담당자를 <b>늘리거나 바꾸라고 명령</b>할 수 있는 경우</li></ul>',
 why:'<ul><li>재해가 반복된다는 건 현재 관리자가 역할을 못 하거나 인원이 부족하다는 신호이므로 행정기관이 개입합니다.</li></ul>',
 detail:'<b>사유 (시행규칙 제12조)</b> — 하나라도 해당하면 명령 가능<ol><li>해당 사업장의 연간재해율이 같은 업종 평균재해율의 <b>2배 이상</b></li><li>중대재해가 연간 <b>2건 이상</b> 발생 (전년도 사망만인율이 같은 업종 평균 이하인 경우는 제외)</li><li>관리자가 질병 등의 사유로 <b>3개월 이상</b> 직무 수행 불가</li><li>화학적 인자로 인한 직업성 질병자가 연간 <b>3명 이상</b> 발생 (해당 인자를 사용하지 않은 경우 제외)</li></ol>암기: <b>"2배 · 2건 · 3개월 · 3명"</b>',
 ex:'<ul><li>올해 사망사고가 2건 발생한 제조공장 → 증원·교체 명령 대상</li><li>안전관리자가 수술로 4개월 휴직 → 교체 명령 대상</li></ul>',
 cmp:'<table><tr><th>숫자</th><th>무엇</th></tr><tr><td>2</td><td>재해율 배수, 중대재해 건수</td></tr><tr><td>3</td><td>직무 불능 개월, 직업성 질병자 수</td></tr></table>',
 exam:'<ul><li>"중대재해 연간 1건 이상", "재해율 1.5배" 등 숫자 바꾼 오답</li><li>직업성 질병자는 <b>화학적 인자</b>로 인한 것만</li></ul>',
 law:'산업안전보건법 제17조제4항 등, 시행규칙 제12조.'},

{id:'c8',title:'8. 도급 관계의 안전보건 조직',
 core:'총괄책임자: 수급인 포함 {{100명}}(1차금속·선박·토사석 {{50명}}) / 건설 {{20억}} / 협의체 {{월 1회}} / 순회점검 건설·제조 등 {{2일 1회}}, 그 외 {{1주 1회}} / 노사협의체 건설 {{120억}}, {{2개월마다}}',
 def:'<ul><li><b>도급</b>: 일을 다른 사업주(수급인)에게 맡기는 것. 원청(도급인) 사업장에서 하청(관계수급인) 근로자가 함께 일하면, 도급인이 전체 안전을 책임지도록 별도 조직을 둡니다.</li></ul>',
 why:'<ul><li>하청 근로자가 원청 사업장의 설비·환경에서 일하므로, 위험을 통제할 권한이 있는 원청에 통합 관리 책임을 줍니다.</li></ul>',
 detail:'<b>① 안전보건총괄책임자 (법 제62조, 시행령 제52조·제53조)</b><ul><li>지정 대상: 관계수급인 근로자를 포함한 상시근로자 {{100명}} 이상 (선박·보트 건조업, 1차 금속 제조업, 토사석 광업은 {{50명}} 이상) / 건설업 총공사금액 {{20억}} 이상</li><li>도급인 사업장의 <b>안전보건관리책임자를 지정</b> (새로 뽑지 않음)</li><li>직무: 위험성평가 실시, <b>작업 중지</b>, 도급 시 산업재해 예방조치, 산업안전보건관리비의 관계수급인 간 사용 협의·조정 및 집행 감독, 안전인증 대상 기계 등 사용 여부 확인</li></ul><b>② 도급인의 산업재해 예방조치 (법 제64조)</b><ul><li>도급인·수급인 <b>안전보건 협의체</b> 구성·운영 — 정기회의 {{월 1회}} 이상</li><li>작업장 <b>순회점검</b>: 건설업·제조업·토사석 광업·서적 등 출판업·음악 출판업·금속 및 비금속 원료 재생업은 {{2일에 1회}} 이상, 그 밖의 사업은 {{1주일에 1회}} 이상</li><li>수급인 근로자 안전보건교육 지원·실시 확인, 경보체계 운영·대피 훈련, 위생시설 장소 제공 등</li></ul><b>③ 노사협의체 (법 제75조, 시행령 제63조~제65조)</b><ul><li>대상: 건설공사 공사금액 {{120억}} 이상(토목공사업 {{150억}} 이상) — 산업안전보건위원회 설치 대상과 같은 금액</li><li>도급인·수급인의 근로자위원과 사용자위원으로 구성</li><li>정기회의 {{2개월마다}}, 임시회의 필요 시</li><li>노사협의체를 구성·운영하면 <b>산업안전보건위원회를 둔 것으로 봄</b></li></ul><b>④ 안전보건조정자 (법 제68조)</b><ul><li>2개 이상의 건설공사를 분리 발주하여 같은 장소에서 행해지고, 공사금액 합계가 {{50억}} 이상이면 <b>발주자</b>가 둠 — 공사 간 혼재 작업 위험 조정</li></ul>',
 ex:'<ul><li>원청 직원 70명 + 하청 40명이 같은 제조공장에서 작업 → 합계 110명이므로 원청 공장장을 총괄책임자로 지정</li><li>원청은 하청과 매월 협의체 회의, 이틀에 한 번 순회점검</li></ul>',
 cmp:'<table><tr><th>회의체</th><th>주기</th><th>대상</th></tr><tr><td>산업안전보건위원회</td><td>{{분기}}마다</td><td>단일 사업장 노사</td></tr><tr><td>노사협의체</td><td>{{2개월}}마다</td><td>건설 120억 이상, 도급인·수급인 노사</td></tr><tr><td>안전보건 협의체</td><td>{{매월}}</td><td>도급인과 수급인(사업주)</td></tr></table>',
 calc:'원청 30명 + 하청 25명 = 55명인 1차 금속 제조업 → 50명 이상이므로 총괄책임자 지정 대상.',
 exam:'<ul><li>회의 주기 3종(분기·2개월·월) 바꿔치기가 대표 함정</li><li>순회점검 2일 1회 vs 1주 1회 업종 구분</li><li>총괄책임자 직무에 "작업 중지"가 포함</li></ul>',
 law:'산업안전보건법 제62조~제68조·제75조, 시행령 제52조·제53조·제63조~제65조, 시행규칙 제79조·제80조.'},

{grp:'1-2. 안전보건관리 체제 및 운용 · ② 산업안전보건위원회'},
{id:'c9',title:'9. 위원회 설치 대상과 구성',
 core:'설치: {{50명}}(유해 제조업 등)·{{300명}}(농업·금융·SW 등)·{{100명}}(그 밖) / 건설 {{120억}}(토목 {{150억}}) / {{노사 동수}} / 각 위원에 지명 위원 {{9명 이내}}',
 def:'<ul><li>사업장의 안전보건 중요 사항을 근로자위원과 사용자위원이 <b>같은 수</b>로 모여 심의·의결하는 기구</li></ul>',
 why:'<ul><li>현장 근로자의 의견이 반영되어야 대책이 지켜지므로 노사 동수로 구성하고, 의결 사항은 양측 모두 따라야 합니다.</li></ul>',
 detail:'<b>설치 대상 (시행령 별표 9)</b><table><tr><th>상시근로자</th><th>업종 예</th></tr><tr><td>{{50명 이상}}</td><td>토사석 광업, 목재·나무제품 제조업(가구 제외), 화학물질·화학제품 제조업(의약품 등 제외), 비금속 광물제품, 1차 금속, 금속가공제품(기계·가구 제외), 자동차·트레일러, 기타 기계·장비, 기타 운송장비 제조업</td></tr><tr><td>{{300명 이상}}</td><td>농업, 어업, 소프트웨어 개발·공급업, 컴퓨터 프로그래밍·시스템 통합, 정보서비스업, 금융·보험업, 임대업(부동산 제외), 전문·과학·기술 서비스업(연구개발업 제외), 사업지원 서비스업, 사회복지 서비스업</td></tr><tr><td>{{100명 이상}}</td><td>그 밖의 업종</td></tr><tr><td>건설업</td><td>공사금액 {{120억}} 이상 (토목공사업 {{150억}} 이상)</td></tr></table><b>구성 (시행령 제35조)</b><table><tr><th>근로자위원</th><th>사용자위원</th></tr><tr><td>① 근로자대표<br>② 명예산업안전감독관 1명 이상(위촉된 경우)<br>③ 근로자대표가 지명하는 {{9명 이내}}의 근로자</td><td>① 사업의 대표자<br>② 안전관리자 1명<br>③ 보건관리자 1명<br>④ 산업보건의(선임된 경우)<br>⑤ 대표자가 지명하는 {{9명 이내}}의 부서장</td></tr></table><ul><li>위원장: 위원 중에서 <b>호선</b>. 근로자위원과 사용자위원 중 각 1명을 <b>공동위원장</b>으로 선출 가능</li></ul>',
 ex:'<ul><li>근로자 80명 1차 금속 제조업 → 50명 이상이므로 설치 대상</li><li>근로자 250명 금융회사 → 300명 미만이므로 설치 의무 없음</li><li>공사금액 130억 토목공사 → 150억 미만이므로 설치 의무 없음</li></ul>',
 cmp:'<table><tr><th>기준 금액</th><th>무엇</th></tr><tr><td>20억</td><td>건설 책임자·총괄책임자</td></tr><tr><td>50억</td><td>건설 안전관리자, 안전보건조정자</td></tr><tr><td>120억(토목 150억)</td><td>위원회·노사협의체, 안전관리자 전담</td></tr></table>',
 exam:'<ul><li>위원회 구성원이 <b>아닌</b> 사람 고르기 (예: "안전보건관리담당자", "수급인 대표"는 위원회 구성원 아님)</li><li>건설 120억 vs 토목 150억</li><li>위원장 "호선" — 대표자가 당연히 위원장이 아님</li></ul>',
 law:'산업안전보건법 제24조, 시행령 제34조·제35조·제36조·별표 9.'},

{id:'c10',title:'10. 위원회 회의·의결·심의사항',
 core:'정기 {{분기마다}} / 개의 = 근로자위원·사용자위원 {{각 과반수}} 출석, 의결 = 출석위원 {{과반수}} 찬성 / 회의록 {{2년}} 보존 / 의결 안 되면 {{제3자 중재}}',
 def:'<ul><li>위원회 회의 운영 방법과, 위원회가 반드시 다뤄야 하는 <b>심의·의결 사항</b></li></ul>',
 why:'<ul><li>양측 각각 과반수가 출석해야 회의가 열리게 해서 한쪽만으로 결정하지 못하게 하고, 결론이 안 나면 중재로 교착을 풉니다.</li></ul>',
 detail:'<b>회의 (시행령 제37조)</b><ul><li>정기회의: {{분기마다}} 위원장이 소집 / 임시회의: 위원장이 필요하다고 인정할 때</li><li>개의·의결: 근로자위원 및 사용자위원 <b>각 과반수 출석</b>으로 시작, <b>출석위원 과반수 찬성</b>으로 의결</li><li>근로자대표 등이 출석하지 못하면 해당 사업 근로자 중 1명을 지정해 대리 가능</li><li>회의록 기재: 개최 일시·장소, 출석위원, 심의 내용 및 의결·결정 사항, 그 밖의 토의 사항 → <b>2년</b> 보존</li><li>심의·의결 결과는 사내방송·게시판 등으로 근로자에게 <b>신속히 알림</b></li></ul><b>의결되지 않은 사항 (시행령 제38조)</b><ul><li>가부동수 등으로 의결되지 않거나, 의결 사항의 해석·이행 방법에 이견이 있으면 → 근로자위원과 사용자위원의 <b>합의로 제3자에게 중재</b> 요청</li><li>중재 결정은 위원회의 <b>의결로 보며</b>, 사업주와 근로자는 따라야 함</li></ul><b>심의·의결 사항 (법 제24조)</b><ol><li>산업재해 예방계획 수립</li><li>안전보건관리규정 작성·변경</li><li>안전보건교육</li><li>작업환경측정 등 작업환경 점검·개선</li><li>건강진단 등 건강관리</li><li>산업재해 통계 기록·유지</li><li><b>중대재해</b> 원인 조사 및 재발 방지대책 수립</li><li>유해·위험 기계·기구·설비 도입 시 안전·보건조치</li></ol>',
 ex:'<ul><li>근로자위원 5명·사용자위원 5명 → 각 3명 이상 출석해야 개의, 출석 7명이면 4명 이상 찬성으로 의결</li></ul>',
 cmp:'<table><tr><th>책임자 업무 9가지</th><th>위원회 심의·의결</th></tr><tr><td>산재 원인조사·재발방지</td><td><b>중대재해</b> 원인조사·재발방지만</td></tr><tr><td>적격품 확인, 위험성평가</td><td>목록에 없음 → 대신 <b>유해·위험 기계 도입 시 조치</b></td></tr></table>',
 calc:'근로자위원 6, 사용자위원 6 → 개의 최소 각 4명(과반수). 8명 출석 시 의결 최소 5명.',
 exam:'<ul><li>정기회의 "월 1회·반기 1회" 함정 → 분기</li><li>회의록 보존 2년</li><li>심의·의결 사항에 해당하지 <b>않는</b> 것 (예: "근로자 채용", "적격품 확인")</li></ul>',
 law:'산업안전보건법 제24조, 시행령 제37조·제38조, 법 제164조(서류 보존).'},

{grp:'1-2. 안전보건관리 체제 및 운용 · ③ 경영시스템 · ④ 관리규정'},
{id:'c11',title:'11. 안전보건경영시스템',
 core:'{{PDCA}} 순환 / KOSHA-MS {{공단 인증}} / ISO 45001 {{국제표준}}(OHSAS 18001 후속) / 위험성평가는 {{Plan}}, 내부심사는 {{Check}}',
 def:'<ul><li><b>안전보건경영시스템</b>: 안전보건 방침을 세우고 계획·실행·점검·개선을 반복하는 사업장 자율 관리 체계</li><li><b>KOSHA-MS</b>: 한국산업안전보건공단이 인증하는 국내 안전보건경영시스템</li><li><b>ISO 45001</b>: 국제표준화기구(ISO)의 안전보건경영시스템 국제 규격</li></ul>',
 why:'<ul><li>법규를 하나씩 지키는 것만으로는 재발을 막기 어려워서, 경영층 책임 아래 <b>지속적 개선</b>이 돌아가는 구조를 만듭니다.</li></ul>',
 detail:'<table><tr><th>단계</th><th>내용</th></tr><tr><td>Plan(계획)</td><td>방침 수립, 유해·위험요인 파악·위험성평가, 법규 검토, 목표·추진계획</td></tr><tr><td>Do(실행)</td><td>조직·책임, 교육·훈련, 의사소통, 문서화, 운영관리, 비상조치</td></tr><tr><td>Check(점검)</td><td>성과 측정·모니터링, 사고·부적합 조사, 내부심사</td></tr><tr><td>Act(개선)</td><td>경영자 검토, 시정·예방조치, 지속적 개선</td></tr></table><ul><li>KOSHA-MS 핵심: 경영자의 안전보건 방침, 근로자 참여, 위험성평가 중심 계획, 점검 및 시정조치, 경영자 검토</li><li>ISO 45001 구조: 조직의 상황 → 리더십과 근로자 참여 → 기획 → 지원 → 운영 → 성과평가 → 개선</li><li>성격: 법정 의무가 아닌 <b>자율 인증</b></li></ul>',
 ex:'<ul><li>재해 제로 방침 선언 → 위험성평가로 목표 설정 → 교육·작업표준 운영 → 월별 내부점검 → 연 1회 경영자 검토</li></ul>',
 cmp:'<table><tr><th></th><th>KOSHA-MS</th><th>ISO 45001</th></tr><tr><td>주체</td><td>한국산업안전보건공단</td><td>국제표준화기구</td></tr><tr><td>성격</td><td>국내 인증</td><td>국제 규격</td></tr></table>',
 exam:'<ul><li>PDCA 단계별 활동 짝짓기</li><li>ISO 45001의 이전 규격 = OHSAS 18001</li></ul>',
 law:'자율 인증 제도(법정 의무 아님). 공단 인증 기준 고시·지침.'},

{id:'c12',title:'12. 안전보건관리규정',
 core:'작성 대상 {{100명}} 이상(농업·금융·SW 등은 {{300명}}) / 사유 발생일부터 {{30일 이내}} / 내용 {{조·교·안·보·사}} / {{위원회 심의·의결}}(없으면 근로자대표 동의)',
 def:'<ul><li>사업장의 안전보건 조직·교육·작업장 관리·사고조사 등을 문서로 정한 <b>사내 규정</b></li></ul>',
 why:'<ul><li>문서로 정해 두면 책임과 절차가 명확해지고, 사람이 바뀌어도 같은 기준이 유지됩니다.</li></ul>',

function mnBox(id){var a=MN[id];if(!a)return '';var h='<div class="mn"><div class="mnh">연상 암기</div>';a.forEach(function(x){h+='<div class="mni"><span class="mnk">'+x.k+'</span><div class="mns">'+x.s+'</div><div class="mnm">→ '+mk(x.m)+'</div></div>'});return h+'</div>';}
var st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
var round=1,maskOn=false,filterOn=false;
var items=DATA.filter(function(d){return d.id});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function g(id){if(!st[id])st[id]={r:[0,0,0,0,0],s:0,v:0};return st[id]}
function mk(t){return (t||'').replace(/\{\{(.+?)\}\}/g,'<span class="m">$1</span>')}

var HINTS={1:'1회독 · 이해: 8칸을 모두 펼쳐 읽습니다. 헷갈리면 「애매함」을 누르세요.',2:'2회독 · 구조화: 세부 내용과 비교표만 봅니다. 애매함은 노란 표시로 강조됩니다.',3:'3회독 · 인출: 핵심 단어가 가려집니다. 떠올린 뒤 눌러 확인하고, 틀리면 ★.',4:'4회독 · 약점: ★·애매함 항목만 다시 풉니다.',5:'5회독 · 초압축: 항목별 한 줄 요약만 가려서 훑습니다. 시험 직전용.'};

function render(){
  var o='',shown=0;
  document.body.classList.toggle('mask',maskOn);
  DATA.forEach(function(d){
    if(d.grp){o+='<h2 class="grp">'+d.grp.replace(/^\S+\s/,function(m){return m})+'</h2>';return}
    var s=g(d.id);
    if((filterOn||round===4)&&!(s.s||s.v))return;
    shown++;
    var open=round===1?ORDER:(round===5?[]:['detail','cmp']);
    var h='<div class="item'+(s.v?' vague':'')+'" id="'+d.id+'"><div class="ih"><div class="tt">'+d.title+(d.tag?'<span class="badge">'+d.tag+'</span>':'')+'</div><div class="chk">';
    for(var i=0;i<5;i++)h+='<label>'+(i+1)+'<input type="checkbox" data-id="'+d.id+'" data-r="'+i+'"'+(s.r[i]?' checked':'')+'></label>';
    h+='</div><div class="ic"><button data-act="v" data-id="'+d.id+'" class="'+(s.v?'on':'')+'">애매함</button><button data-act="s" data-id="'+d.id+'" class="'+(s.s?'on':'')+'">★</button></div></div>';
    h+='<div class="core"><b>핵심</b> · '+mk(d.core)+'</div>';
    h+=mnBox(d.id);
    if(round!==5){
      ORDER.forEach(function(k){
        if(!d[k])return;
        h+='<details'+(open.indexOf(k)>-1?' open':'')+'><summary>'+LABEL[k]+'</summary><div class="cb">'+mk(d[k])+'</div></details>';
      });
    }
    h+='</div>';o+=h;
  });
  if(!shown)o+='<div class="empty">표시할 항목이 없습니다. ★·애매함을 표시한 항목이 여기에 모입니다.</div>';
  document.getElementById('list').innerHTML=o;
  var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
  document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
  document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  document.getElementById('hint').textContent=HINTS[round];
  var rb=document.querySelectorAll('#rounds button');
  for(var i=0;i<rb.length;i++)rb[i].classList.toggle('on',i===round-1);
  document.getElementById('bMask').classList.toggle('on',maskOn);
  document.getElementById('bStar').classList.toggle('on',filterOn);
}

(function init(){
  var r=document.getElementById('rounds');
  for(var i=1;i<=5;i++){var b=document.createElement('button');b.innerHTML=i+'<span class="w">회독</span>';b.setAttribute('data-round',i);r.appendChild(b)}
  r.addEventListener('click',function(e){
    var bt=e.target.closest('button');var n=bt&&bt.getAttribute('data-round');if(!n)return;
    round=+n;maskOn=(round>=3);render();
  });
  document.getElementById('bMask').onclick=function(){maskOn=!maskOn;render()};
  document.getElementById('bStar').onclick=function(){filterOn=!filterOn;render()};
  document.getElementById('list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('m')&&document.body.classList.contains('mask')){t.classList.toggle('show');return}
    var a=t.getAttribute&&t.getAttribute('data-act');
    if(a){var s=g(t.getAttribute('data-id'));s[a]=s[a]?0:1;save();render()}
  });
  document.getElementById('list').addEventListener('change',function(e){
    var t=e.target;if(t.type!=='checkbox')return;
    var s=g(t.getAttribute('data-id'));s.r[+t.getAttribute('data-r')]=t.checked?1:0;save();
    var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
    document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
    document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  });
  render();
})();
</script>
