 core:'사업주 {{법 기준 준수·쾌적한 환경·정보 제공}} / 근로자 {{기준 준수·사업주 등의 조치에 따름}} / 급박한 위험 → 사업주 {{작업중지·대피}}, 근로자 {{대피 가능(불이익 금지)}} / 중대재해 → 장관 {{작업중지 명령}}',

 detail:'<b>정부의 책무 (법 제4조)</b>: 산업안전·보건 정책 수립·집행, 산업재해 예방 지원·지도, 기술 연구·개발, 안전문화 확산, 통계 관리 등<br><b>사업주의 의무 (법 제5조)</b><ul><li>이 법과 명령에서 정하는 산업재해 예방 기준을 지킬 것</li><li>근로자의 신체적 피로·정신적 스트레스 등을 줄일 수 있는 쾌적한 작업환경 조성 및 근로조건 개선</li><li>사업장의 안전·보건에 관한 정보를 근로자에게 제공</li></ul><b>근로자의 의무 (법 제6조)</b><ul><li>이 법과 명령에서 정하는 산업재해 예방 기준을 지킬 것</li><li>사업주 또는 근로감독관, 공단 등 관계인이 실시하는 산업재해 예방 조치에 따를 것</li></ul><b>작업중지</b><table><tr><th>주체</th><th>내용</th></tr><tr><td>{{사업주}} (법 제51조)</td><td>산업재해가 발생할 급박한 위험이 있으면 즉시 작업을 중지시키고 근로자를 작업장소에서 대피시키는 등 필요한 조치</td></tr><tr><td>{{근로자}} (법 제52조)</td><td>급박한 위험이 있으면 작업을 중지하고 대피할 수 있음 → 지체 없이 관리감독자 등에게 보고. 합리적 이유가 있으면 사업주는 불리한 처우 금지</td></tr><tr><td>{{고용노동부장관}} (법 제55조)</td><td>중대재해 발생 시 그 작업, 또는 같은 작업으로 재해가 다시 발생할 급박한 위험이 있으면 작업중지 명령</td></tr></table><span style="color:var(--sub);font-size:13px">※ 2026년 10월 국회를 통과한 개정안에 근로자대표 등의 작업중지 요구권 확대가 들어 있으나 공포 후 6개월 뒤 시행이라 2026년 시험 범위와는 거리가 있습니다.</span>',
 ex:'<ul><li>굴착면에 균열이 생겨 붕괴 조짐 → 근로자가 스스로 작업 중지·대피 후 보고</li></ul>',
 cmp:'<table><tr><th>사업주</th><th>근로자</th></tr><tr><td>작업중지·대피 <b>의무</b></td><td>작업중지·대피 <b>권리</b> + 보고 의무</td></tr></table>',
 exam:'<ul><li>근로자의 의무에 해당하는 것 고르기</li><li>근로자가 대피한 경우 불이익 처우 금지</li></ul>',
 law:'산업안전보건법 제4조~제6조, 제51조~제55조.'},

{id:'h4',title:'4. 위험성평가',
 core:'절차 {{사전준비 → 유해·위험요인 파악 → 위험성 결정 → 감소대책 수립·실행 → 공유 → 기록·보존}} / 시기 {{최초·수시·정기(매년)·상시}} / 기록 {{3년}} 보존 / 방법 {{체크리스트·OPS·3단계 판단법}} 등',
 def:'<ul><li><b>위험성평가</b>: 사업주가 스스로 유해·위험요인을 파악하고, 위험성 수준을 결정해, 감소대책을 세우고 실행하는 과정</li></ul>',
 why:'<ul><li>정부가 모든 위험을 규칙으로 정할 수 없으므로, 사업장이 스스로 위험을 찾고 관리하는 <b>자기규율 예방체계</b>의 핵심 수단입니다.</li></ul>',
 detail:'<b>법적 근거</b>: 산업안전보건법 제36조, 고시 「사업장 위험성평가에 관한 지침」<br><b>절차 (2023년 개정 고시)</b><ol><li>사전준비 (평가 실시 규정, 평가 대상 선정 등)</li><li>{{유해·위험요인 파악}}</li><li>{{위험성 결정}} (허용 가능 여부 판단)</li><li>{{위험성 감소대책 수립 및 실행}}</li><li>위험성평가 실시 내용·결과의 {{공유}} (근로자에게 알림, TBM 등)</li><li>{{기록 및 보존}}</li></ol><ul><li>2023년 개정으로 <b>"위험성 추정" 단계가 삭제</b>되어 빈도×강도 계산이 필수가 아님</li></ul><b>실시 시기</b><table><tr><th>구분</th><th>내용</th></tr><tr><td>{{최초평가}}</td><td>사업 성립 후 일정 기간 내 착수 (개정 고시: 1개월 이내)</td></tr><tr><td>{{수시평가}}</td><td>설비 신규 도입·변경, 작업방법 변경, 중대 산업재해 발생 등 사유 발생 시</td></tr><tr><td>{{정기평가}}</td><td>최초평가 후 매년 (전년 결과를 재검토)</td></tr><tr><td>{{상시평가}}</td><td>월 1회 이상 평가 + 주 1회 회의 + 매일 TBM 공유 시 수시·정기평가를 한 것으로 봄</td></tr></table><b>평가 방법</b>: 위험 가능성과 중대성을 조합하는 방법, 체크리스트법, 핵심요인 기술법(OPS), 3단계(저·중·고) 판단법 등<br><b>근로자 참여</b>: 유해·위험요인 파악, 감소대책 수립, 결과 공유 등 전 과정<br><b>기록 보존</b>: {{3년}}',
 ex:'<ul><li>새 프레스 도입 → 사용 전 수시평가 / 매년 1월 정기평가</li></ul>',
 cmp:'<table><tr><th>개정 전</th><th>개정 후 (2023)</th></tr><tr><td>위험성 추정(빈도×강도) 필수</td><td>추정 삭제, 3단계 판단법·OPS 등 간편 방법 허용</td></tr><tr><td>정기평가 매년 전체 재평가</td><td>전년 결과 재검토 가능, 상시평가 도입</td></tr></table>',
 exam:'<ul><li>절차 순서 (옛 교재의 "위험성 추정" 단계가 보기로 나올 수 있음 — 현행은 삭제)</li><li>기록 보존 3년</li></ul>',
 law:'산업안전보건법 제36조, 시행규칙 제37조, 고용노동부 고시 「사업장 위험성평가에 관한 지침」(2023 전부개정 이후).'},

{id:'h5',title:'5. 산업재해 발생 보고와 기록',
 core:'사망·{{3일 이상 휴업}} → 재해 발생일부터 {{1개월 이내}} 산업재해조사표 제출 / 중대재해 → {{지체 없이}} 보고 / 기록 {{3년}} 보존',
 def:'<ul><li>산업재해가 발생하면 사업주는 원인을 조사·기록하고 관할 지방고용노동관서에 보고해야 합니다.</li></ul>',
 detail:'<table><tr><th>구분</th><th>대상</th><th>기한·방법</th></tr><tr><td>{{산업재해조사표}}</td><td>사망자 또는 <b>3일 이상 휴업</b>이 필요한 부상·질병</td><td>발생일부터 <b>1개월 이내</b> 관할 지방고용노동관서에 제출</td></tr><tr><td>{{중대재해 보고}}</td><td>중대재해</td><td><b>지체 없이</b> 전화·팩스 등으로 발생 개요·피해 상황·조치 및 전망 보고</td></tr><tr><td>{{기록·보존}}</td><td>산업재해 발생 시</td><td>사업장 개요·근로자 인적사항, 재해 발생 일시·장소, 재해 과정, 재해 재발방지 계획을 기록하고 <b>3년</b> 보존</td></tr></table><ul><li>산업재해 발생 사실을 은폐하거나 보고하지 않으면 과태료·벌칙</li><li>산업재해조사표에는 근로자대표 확인을 받아야 함 (근로자대표가 이견이 있으면 그 내용 첨부)</li></ul>',
 ex:'<ul><li>3월 5일 발생, 4일 휴업 → 4월 4일 무렵까지 산업재해조사표 제출</li></ul>',
 cmp:'<table><tr><th>일반 재해(3일 이상 휴업)</th><th>중대재해</th></tr><tr><td>1개월 이내 조사표</td><td>지체 없이 보고 (+ 조사표)</td></tr></table>',
 exam:'<ul><li>"3일 이상", "1개월 이내", "지체 없이" 숫자·표현 바꾸기</li></ul>',
 law:'산업안전보건법 제57조(산업재해 발생 은폐 금지 및 보고 등), 시행규칙 제67조·제72조·제73조.'},

{id:'h6',title:'6. 유해·위험 기계 등의 관리 (안전인증·자율안전확인·안전검사)',
 core:'안전인증 = {{제조·수입 전}} 정부 인증 / 자율안전확인 = {{스스로 확인 후 신고}} / 안전검사 = {{사용 중}} 정기 검사 — 최초 {{3년 이내}}, 이후 {{2년마다}}, 건설현장 크레인·리프트·곤돌라 {{6개월마다}}',
 def:'<ul><li>위험한 기계·방호장치·보호구는 만들 때(인증·확인)와 쓰는 동안(검사) 모두 관리합니다.</li></ul>',
 detail:'<table><tr><th>제도</th><th>의무자</th><th>시점</th><th>대상 예</th></tr><tr><td>{{안전인증}}</td><td>제조·수입자</td><td>제조·수입 전</td><td>프레스, 전단기, 크레인, 리프트, 압력용기, 롤러기, 사출성형기, 고소작업대, 곤돌라 / 방호장치 / 보호구 12종</td></tr><tr><td>{{자율안전확인}}</td><td>제조·수입자</td><td>스스로 확인 후 신고</td><td>연삭기, 산업용 로봇, 혼합기, 파쇄기, 컨베이어, 자동차정비용 리프트, 공작기계, 고정형 목재가공용 기계 등 / 일부 방호장치 / 보호구 3종</td></tr><tr><td>{{안전검사}}</td><td><b>사용하는 사업주</b></td><td>사용 중 정기</td><td>프레스, 전단기, 크레인(2톤 이상), 리프트, 압력용기, 곤돌라, 국소배기장치, 원심기, 롤러기, 사출성형기, 고소작업대, 컨베이어, 산업용 로봇, 혼합기, 파쇄기 등</td></tr></table><b>안전검사 주기</b><table><tr><th>대상</th><th>최초</th><th>이후</th></tr><tr><td>크레인(이동식 제외)·리프트(이삿짐운반용 제외)·곤돌라</td><td>설치 후 {{3년 이내}}</td><td>{{2년마다}} / 건설현장은 최초 설치일부터 {{6개월마다}}</td></tr><tr><td>이동식 크레인·이삿짐운반용 리프트·고소작업대</td><td>신규 등록 후 3년 이내</td><td>2년마다</td></tr><tr><td>그 밖의 기계 (프레스·압력용기 등)</td><td>설치 후 3년 이내</td><td>2년마다 (공정안전보고서 이행 우수 압력용기는 {{4년마다}})</td></tr></table>',
 ex:'<ul><li>아파트 현장 타워크레인 → 설치 후 6개월마다 안전검사</li></ul>',
 cmp:'<table><tr><th>안전인증·자율확인</th><th>안전검사</th></tr><tr><td>만드는 사람(제조·수입자)</td><td>쓰는 사람(사업주)</td></tr></table>',
 exam:'<ul><li>안전검사 주기 숫자 (3년 → 2년, 건설 6개월)</li><li>제도별 의무자 구분</li></ul>',
 law:'산업안전보건법 제84조~제98조, 시행령 제74조·제77조·제78조, 시행규칙 제126조(안전검사의 주기).'},

{id:'h7',title:'7. 유해위험방지계획서',
 core:'제조업 {{전기 계약용량 300kW 이상}} → 작업 시작 {{15일 전}} / 건설 {{31m·3만㎡·5천㎡(문화·집회 등)·교량 50m·터널·댐 2천만톤·굴착 10m}} → {{착공 전날}}까지 / 제출처 {{안전보건공단}}',
 def:'<ul><li>유해·위험한 사업이나 건설공사를 시작하기 전에 위험 요인과 방지 대책을 정리해 공단의 심사를 받는 계획서</li></ul>',
 why:'<ul><li>설계·계획 단계에서 위험을 걸러내면 공사 중 사고와 변경 비용을 크게 줄일 수 있습니다.</li></ul>',
 detail:'<b>제출 대상 — 사업</b><ul><li>일정 업종(금속가공·기계·전자부품·화학 등 제조업)으로서 전기 계약용량 {{300kW 이상}}인 사업의 설치·이전·주요 구조부분 변경</li><li>유해·위험 기계·기구·설비(금속 용해로, 화학설비, 건조설비, 가스집합 용접장치, 허가·관리대상 물질 관련 국소배기장치 등) 설치·이전·변경</li></ul><b>제출 대상 — 건설공사</b><ul><li>지상높이 {{31m 이상}}인 건축물·인공구조물</li><li>연면적 {{3만㎡ 이상}}인 건축물</li><li>연면적 {{5천㎡ 이상}}인 문화·집회시설, 판매시설, 운수시설, 종교시설, 의료시설 중 종합병원, 숙박시설 중 관광숙박시설, 지하도상가, 냉동·냉장 창고시설</li><li>연면적 5천㎡ 이상 냉동·냉장 창고시설의 설비공사·단열공사</li><li>최대 지간길이 {{50m 이상}}인 다리</li><li>{{터널}} 건설 등</li><li>다목적댐·발전용댐, 저수용량 {{2천만 톤 이상}} 용수 전용댐·지방상수도 전용댐</li><li>깊이 {{10m 이상}}인 굴착공사</li></ul><b>제출 기한·방법</b><ul><li>제조업 등: 해당 작업 시작 <b>15일 전</b>까지 공단에 2부</li><li>건설공사: 공사 <b>착공 전날</b>까지 공단에 2부</li><li>공단은 받은 날부터 15일 이내 심사 → 적정·조건부 적정·부적정</li></ul>',
 ex:'<ul><li>지상 35층 오피스텔 (31m 초과) → 착공 전날까지 계획서 제출</li></ul>',
 exam:'<ul><li>건설공사 대상 숫자 (31m, 3만㎡, 5천㎡, 50m, 2천만 톤, 10m)</li><li>제출 기한 (제조 15일 전, 건설 착공 전날)</li></ul>',

 detail:'<b>작업환경측정 (법 제125조)</b><ul><li>유해인자에 노출되는 근로자가 있는 작업장: <b>6개월에 1회 이상</b> (최초는 작업 시작일부터 30일 이내)</li><li>노출기준 초과 등은 3개월에 1회 이상, 일정 조건 충족 시 1년에 1회로 완화</li><li>측정 결과는 근로자에게 알리고, 결과 보존 <b>5년</b> (발암성 물질은 30년)</li></ul><b>건강진단 (법 제129조~제131조)</b><table><tr><th>종류</th><th>대상·시기</th></tr><tr><td>{{일반건강진단}}</td><td>상시 근로자: 사무직 <b>2년에 1회</b>, 그 외 <b>1년에 1회</b> 이상</td></tr><tr><td>{{특수건강진단}}</td><td>특수건강진단 대상 유해인자 노출 근로자, 유해인자별 주기</td></tr><tr><td>{{배치전건강진단}}</td><td>특수건강진단 대상 업무에 배치하기 전</td></tr><tr><td>{{수시건강진단}}</td><td>직업성 천식·피부염 등 건강장해 증상 호소 시</td></tr><tr><td>{{임시건강진단}}</td><td>같은 부서에 유사 증상자 발생 등 지방고용노동관서장 명령 시</td></tr></table><ul><li>건강진단 결과 보존 <b>5년</b> (발암성 물질 관련은 30년)</li></ul>',

{grp:'6-4. 산업안전보건기준에 관한 규칙'},
{id:'h11',title:'11. 작업장 일반 기준 (조도·통로·계단·안전난간·사다리)',
 core:'조도 {{초정밀 750·정밀 300·보통 150·기타 75lux}} / 안전난간 상부 {{90cm 이상}}, 발끝막이판 {{10cm 이상}}, {{100kg}} 하중 / 계단 폭 {{1m}}, 높이 3m 초과 시 {{1.2m}} 계단참 / 가설통로 경사 {{30°}} 이하 / 사다리 {{60cm}} 연장, 기울기 {{75°}} 이하',
 def:'<ul><li>모든 사업장에 공통으로 적용되는 작업장 기본 시설 기준 (안전보건기준규칙 제1편 총칙)</li></ul>',
 detail:'<b>작업장 조도 (제8조)</b><table><tr><th>작업</th><th>조도</th></tr><tr><td>초정밀작업</td><td>{{750lux}} 이상</td></tr><tr><td>정밀작업</td><td>{{300lux}} 이상</td></tr><tr><td>보통작업</td><td>{{150lux}} 이상</td></tr><tr><td>그 밖의 작업</td><td>{{75lux}} 이상</td></tr></table><ul><li>통로 조명: {{75lux}} 이상 (제21조)</li><li>통로 높이 {{2m}} 이내에는 장애물이 없도록 (제22조)</li></ul><b>안전난간 (제13조)</b><ul><li>구성: 상부 난간대, 중간 난간대, 발끝막이판, 난간기둥</li><li>상부 난간대: 바닥면 등으로부터 {{90cm 이상}} — 120cm 이하이면 중간 난간대는 상부와 바닥 중간에, 120cm 이상이면 중간 난간대를 2단 이상 균등하게 (간격 60cm 이하)</li><li>발끝막이판: 바닥면 등으로부터 {{10cm 이상}}</li><li>난간대: 지름 2.7cm 이상 금속제 파이프 또는 동등 이상 강도</li><li>가장 취약한 지점에서 가장 취약한 방향으로 작용하는 {{100kg 이상}} 하중에 견딜 것</li></ul><b>계단 (제26조~제30조)</b><ul><li>계단·계단참: 매 ㎡당 500kg 이상 하중에 견디는 강도, 안전율 4 이상</li><li>폭 {{1m 이상}} (급유용·보수용·비상용 등 제외)</li><li>높이가 3m를 초과하면 3m 이내마다 진행방향 길이 {{1.2m 이상}} 계단참</li><li>계단 바닥면으로부터 높이 2m 이내에 장애물 없게</li><li>높이 1m 이상 계단의 개방된 측면에 안전난간</li></ul><b>가설통로 (제23조)</b><ul><li>경사 {{30도 이하}} (계단 설치 등 예외), 경사 15도 초과 시 미끄러지지 않는 구조</li><li>추락 위험 장소에 안전난간</li><li>수직갱 15m 이상이면 10m 이내마다 계단참, 건설공사 높이 8m 이상 비계다리는 7m 이내마다 계단참</li></ul><b>사다리식 통로 (제24조)</b><ul><li>발판과 벽 사이 15cm 이상, 폭 30cm 이상</li><li>사다리 상단은 걸쳐놓은 지점부터 {{60cm 이상}} 올라가게</li><li>길이 10m 이상이면 5m 이내마다 계단참</li><li>기울기 {{75도 이하}} (고정식은 90도 이하, 높이 7m 이상이면 바닥에서 2.5m 지점부터 등받이울)</li></ul>',
 ex:'<ul><li>정밀 부품 검사대 → 300lux 이상 / 일반 창고 통로 → 75lux 이상</li></ul>',
 cmp:'<table><tr><th>숫자</th><th>무엇</th></tr><tr><td>90cm</td><td>상부 난간대</td></tr><tr><td>10cm</td><td>발끝막이판</td></tr><tr><td>60cm</td><td>사다리 상단 연장 / 중간난간대 간격</td></tr><tr><td>1.2m</td><td>계단참 길이</td></tr></table>',
 exam:'<ul><li>조도 기준 숫자 (750·300·150·75)</li><li>안전난간 치수와 하중</li><li>※ 비계·작업발판·추락방호망 등 건설 기준은 5과목에서</li></ul>',

 {k:'사다리 60 · 75',s:'"사다리는 위로 <b>팔뚝 하나</b>(60cm) 더 나오게, 각도는 <b>칠십오</b>도"',m:'상단 연장 {{60cm 이상}} / 기울기 {{75° 이하}}'}]

function mnBox(id){var a=MN[id];if(!a)return '';var h='<div class="mn"><div class="mnh">연상 암기</div>';a.forEach(function(x){h+='<div class="mni"><span class="mnk">'+x.k+'</span><div class="mns">'+x.s+'</div><div class="mnm">→ '+mk(x.m)+'</div></div>'});return h+'</div>';}
var st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
var round=1,maskOn=false,filterOn=false;
var items=DATA.filter(function(d){return d.id});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function g(id){if(!st[id])st[id]={r:[0,0,0,0,0],s:0,v:0};return st[id]}
function mk(t){return (t||'').replace(/\{\{(.+?)\}\}/g,'<span class="m">$1</span>')}

var HINTS={1:'1회독 · 이해: 8칸을 모두 펼쳐 읽습니다. 헷갈리면 「애매함」을 누르세요.',2:'2회독 · 구조화: 세부 내용과 비교표만 봅니다. 애매함은 노란 표시로 강조됩니다.',3:'3회독 · 인출: 핵심 단어가 가려집니다. 떠올린 뒤 눌러 확인하고, 틀리면 ★.',4:'4회독 · 약점: ★·애매함 항목만 다시 풉니다.',5:'5회독 · 초압축: 항목별 한 줄 요약만 가려서 훑습니다. 시험 직전용.'};

function render(){
  var o='',shown=0;
  document.body.classList.toggle('mask',maskOn);
  DATA.forEach(function(d){
    if(d.grp){o+='<h2 class="grp">'+d.grp.replace(/^\S+\s/,function(m){return m})+'</h2>';return}
    var s=g(d.id);
    if((filterOn||round===4)&&!(s.s||s.v))return;
    shown++;
    var open=round===1?ORDER:(round===5?[]:['detail','cmp']);
    var h='<div class="item'+(s.v?' vague':'')+'" id="'+d.id+'"><div class="ih"><div class="tt">'+d.title+(d.tag?'<span class="badge">'+d.tag+'</span>':'')+'</div><div class="chk">';
    for(var i=0;i<5;i++)h+='<label>'+(i+1)+'<input type="checkbox" data-id="'+d.id+'" data-r="'+i+'"'+(s.r[i]?' checked':'')+'></label>';
    h+='</div><div class="ic"><button data-act="v" data-id="'+d.id+'" class="'+(s.v?'on':'')+'">애매함</button><button data-act="s" data-id="'+d.id+'" class="'+(s.s?'on':'')+'">★</button></div></div>';
    h+='<div class="core"><b>핵심</b> · '+mk(d.core)+'</div>';
    h+=mnBox(d.id);
    if(round!==5){
      ORDER.forEach(function(k){
        if(!d[k])return;
        h+='<details'+(open.indexOf(k)>-1?' open':'')+'><summary>'+LABEL[k]+'</summary><div class="cb">'+mk(d[k])+'</div></details>';
      });
    }
    h+='</div>';o+=h;
  });
  if(!shown)o+='<div class="empty">표시할 항목이 없습니다. ★·애매함을 표시한 항목이 여기에 모입니다.</div>';
  document.getElementById('list').innerHTML=o;
  var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
  document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
  document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  document.getElementById('hint').textContent=HINTS[round];
  var rb=document.querySelectorAll('#rounds button');
  for(var i=0;i<rb.length;i++)rb[i].classList.toggle('on',i===round-1);
  document.getElementById('bMask').classList.toggle('on',maskOn);
  document.getElementById('bStar').classList.toggle('on',filterOn);
}

(function init(){
  var r=document.getElementById('rounds');
  for(var i=1;i<=5;i++){var b=document.createElement('button');b.innerHTML=i+'<span class="w">회독</span>';b.setAttribute('data-round',i);r.appendChild(b)}
  r.addEventListener('click',function(e){
    var bt=e.target.closest('button');var n=bt&&bt.getAttribute('data-round');if(!n)return;
    round=+n;maskOn=(round>=3);render();
  });
  document.getElementById('bMask').onclick=function(){maskOn=!maskOn;render()};
  document.getElementById('bStar').onclick=function(){filterOn=!filterOn;render()};
  document.getElementById('list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('m')&&document.body.classList.contains('mask')){t.classList.toggle('show');return}
    var a=t.getAttribute&&t.getAttribute('data-act');
    if(a){var s=g(t.getAttribute('data-id'));s[a]=s[a]?0:1;save();render()}
  });
  document.getElementById('list').addEventListener('change',function(e){
    var t=e.target;if(t.type!=='checkbox')return;
    var s=g(t.getAttribute('data-id'));s.r[+t.getAttribute('data-r')]=t.checked?1:0;save();
    var done=0;items.forEach(function(d){if(g(d.id).r[round-1])done++});
    document.getElementById('prog').textContent=round+'회독 '+done+'/'+items.length;
    document.getElementById('barfill').style.width=(done/items.length*100)+'%';
  });
  render();
})();
</script>
